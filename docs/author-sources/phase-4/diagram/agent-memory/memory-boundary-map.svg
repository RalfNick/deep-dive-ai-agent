<svg viewBox="0 0 960 440" xmlns="http://www.w3.org/2000/svg">
<style>
  @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&amp;display=swap');
  text { font-family: 'JetBrains Mono', 'Noto Sans SC', 'PingFang SC', sans-serif; }
  .title { fill:#f8fafc; font-size:18px; font-weight:700; }
  .subtitle { fill:#94a3b8; font-size:10px; }
  .label { fill:#f8fafc; font-size:12px; font-weight:700; }
  .desc { fill:#cbd5e1; font-size:9px; }
  .tiny { fill:#94a3b8; font-size:8px; }
  .badge { fill:#0f172a; stroke-width:1.2; }
  .line { fill:none; stroke:#64748b; stroke-width:1.4; marker-end:url(#arrow); }
  .dash { fill:none; stroke:#64748b; stroke-width:1.2; stroke-dasharray:5 4; marker-end:url(#arrow); }
</style>
<defs>
  <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
    <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e293b" stroke-width="0.55"/>
  </pattern>
  <marker id="arrow" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
    <polygon points="0 0, 10 3.5, 0 7" fill="#64748b"/>
  </marker>
  <marker id="arrow-cyan" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
    <polygon points="0 0, 10 3.5, 0 7" fill="#22d3ee"/>
  </marker>
  <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
    <feGaussianBlur stdDeviation="2.4" result="blur"/>
    <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
</defs><rect width="100%" height="100%" fill="#0f172a"/><rect width="100%" height="100%" fill="url(#grid)" opacity="0.7"/>
<text x="34" y="42" class="title">RAG / Checkpoint / Memory：三层边界</text><text x="34" y="62" class="subtitle">不要把资料检索、执行恢复、长期上下文混成一件事</text>
<g>
    <rect x="58" y="118" width="230" height="160" rx="10" fill="#0f172a"/>
    <rect x="58" y="118" width="230" height="160" rx="10" fill="rgba(8,51,68,0.42)" stroke="#22d3ee" stroke-width="1.5" filter="url(#glow)"/>
    <text x="173" y="144" text-anchor="middle" class="label">RAG</text>
    <text x="173" y="164" text-anchor="middle" class="desc">外部知识检索</text>
  </g>
<text x="173" y="202" text-anchor="middle" class="desc">文档、代码、benchmark</text>
<text x="173" y="222" text-anchor="middle" class="desc">每次 query 独立召回证据</text>
<g>
    <rect x="365" y="118" width="230" height="160" rx="10" fill="#0f172a"/>
    <rect x="365" y="118" width="230" height="160" rx="10" fill="rgba(120,53,15,0.35)" stroke="#fbbf24" stroke-width="1.5" filter="url(#glow)"/>
    <text x="480" y="144" text-anchor="middle" class="label">Checkpoint</text>
    <text x="480" y="164" text-anchor="middle" class="desc">本轮执行现场</text>
  </g>
<text x="480" y="202" text-anchor="middle" class="desc">state、node path、pending action</text>
<text x="480" y="222" text-anchor="middle" class="desc">暂停、恢复、回放工作流</text>
<g>
    <rect x="672" y="118" width="230" height="160" rx="10" fill="#0f172a"/>
    <rect x="672" y="118" width="230" height="160" rx="10" fill="rgba(76,29,149,0.42)" stroke="#a78bfa" stroke-width="1.5" filter="url(#glow)"/>
    <text x="787" y="144" text-anchor="middle" class="label">Memory</text>
    <text x="787" y="164" text-anchor="middle" class="desc">跨会话长期上下文</text>
  </g>
<text x="787" y="202" text-anchor="middle" class="desc">偏好、实体、任务状态</text>
<text x="787" y="222" text-anchor="middle" class="desc">更新、召回、遗忘、隔离</text>
<path d="M288 198 L365 198" class="line"/>
<path d="M595 198 L672 198" class="line"/>
<g><rect x="90" y="316" width="88" height="24" rx="12" fill="rgba(30,41,59,0.75)" stroke="#22d3ee"/><text x="134" y="332" text-anchor="middle" class="tiny" fill="#22d3ee">证据来自资料库</text></g>
<g><rect x="386" y="316" width="98" height="24" rx="12" fill="rgba(30,41,59,0.75)" stroke="#fbbf24"/><text x="435" y="332" text-anchor="middle" class="tiny" fill="#fbbf24">状态属于一次运行</text></g>
<g><rect x="690" y="316" width="138" height="24" rx="12" fill="rgba(30,41,59,0.75)" stroke="#a78bfa"/><text x="759" y="332" text-anchor="middle" class="tiny" fill="#a78bfa">记忆属于用户/项目/任务</text></g>
<rect x="58" y="374" width="844" height="34" rx="17" fill="rgba(15,23,42,0.85)" stroke="#334155"/>
<text x="480" y="396" text-anchor="middle" class="desc">一句话：RAG 给答案找证据，Checkpoint 让执行可恢复，Memory 让 Agent 形成连续工作上下文。</text>
</svg>
