<svg viewBox="0 0 960 520" xmlns="http://www.w3.org/2000/svg">
<style>
  @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&amp;display=swap');
  text { font-family: 'JetBrains Mono', 'Noto Sans SC', 'PingFang SC', sans-serif; }
  .title { fill:#f8fafc; font-size:18px; font-weight:700; }
  .subtitle { fill:#94a3b8; font-size:10px; }
  .label { fill:#f8fafc; font-size:12px; font-weight:700; }
  .desc { fill:#cbd5e1; font-size:9px; }
  .tiny { fill:#94a3b8; font-size:8px; }
  .badge { fill:#0f172a; stroke-width:1.2; }
  .line { fill:none; stroke:#64748b; stroke-width:1.4; marker-end:url(#arrow); }
  .dash { fill:none; stroke:#64748b; stroke-width:1.2; stroke-dasharray:5 4; marker-end:url(#arrow); }
</style>
<defs>
  <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
    <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e293b" stroke-width="0.55"/>
  </pattern>
  <marker id="arrow" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
    <polygon points="0 0, 10 3.5, 0 7" fill="#64748b"/>
  </marker>
  <marker id="arrow-cyan" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
    <polygon points="0 0, 10 3.5, 0 7" fill="#22d3ee"/>
  </marker>
  <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
    <feGaussianBlur stdDeviation="2.4" result="blur"/>
    <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
</defs><rect width="100%" height="100%" fill="#0f172a"/><rect width="100%" height="100%" fill="url(#grid)" opacity="0.7"/>
<text x="34" y="42" class="title">MemoryRecord：长期记忆不是字符串列表</text><text x="34" y="62" class="subtitle">类型、subject、元数据决定它能不能被更新、召回和治理</text>
<rect x="70" y="104" width="360" height="330" rx="16" fill="rgba(76,29,149,0.22)" stroke="#a78bfa" stroke-width="1.4"/>
<text x="96" y="136" class="label">MemoryRecord</text>
<g>
    <rect x="104" y="160" width="132" height="56" rx="10" fill="#0f172a"/>
    <rect x="104" y="160" width="132" height="56" rx="10" fill="rgba(76,29,149,0.38)" stroke="#a78bfa" stroke-width="1.5" filter="url(#glow)"/>
    <text x="170" y="186" text-anchor="middle" class="label">type</text>
    <text x="170" y="206" text-anchor="middle" class="desc">preference / entity / task</text>
  </g>
<g>
    <rect x="262" y="160" width="132" height="56" rx="10" fill="#0f172a"/>
    <rect x="262" y="160" width="132" height="56" rx="10" fill="rgba(76,29,149,0.38)" stroke="#a78bfa" stroke-width="1.5" filter="url(#glow)"/>
    <text x="328" y="186" text-anchor="middle" class="label">subject</text>
    <text x="328" y="206" text-anchor="middle" class="desc">response_style</text>
  </g>
<g>
    <rect x="104" y="240" width="290" height="56" rx="10" fill="#0f172a"/>
    <rect x="104" y="240" width="290" height="56" rx="10" fill="rgba(8,51,68,0.38)" stroke="#22d3ee" stroke-width="1.5" filter="url(#glow)"/>
    <text x="249" y="266" text-anchor="middle" class="label">content</text>
    <text x="249" y="286" text-anchor="middle" class="desc">用户希望代码示例优先用 Python</text>
  </g>
<g>
    <rect x="104" y="320" width="132" height="56" rx="10" fill="#0f172a"/>
    <rect x="104" y="320" width="132" height="56" rx="10" fill="rgba(6,78,59,0.38)" stroke="#34d399" stroke-width="1.5" filter="url(#glow)"/>
    <text x="170" y="346" text-anchor="middle" class="label">confidence</text>
    <text x="170" y="366" text-anchor="middle" class="desc">0.7 - 0.9</text>
  </g>
<g>
    <rect x="262" y="320" width="132" height="56" rx="10" fill="#0f172a"/>
    <rect x="262" y="320" width="132" height="56" rx="10" fill="rgba(120,53,15,0.32)" stroke="#fbbf24" stroke-width="1.5" filter="url(#glow)"/>
    <text x="328" y="346" text-anchor="middle" class="label">timestamps</text>
    <text x="328" y="366" text-anchor="middle" class="desc">created / updated / accessed</text>
  </g>
<rect x="530" y="116" width="340" height="106" rx="14" fill="rgba(8,51,68,0.36)" stroke="#22d3ee"/>
<text x="700" y="145" text-anchor="middle" class="label">稳定更新键</text>
<text x="700" y="172" text-anchor="middle" class="desc">memory_type + subject + hash</text>
<text x="700" y="194" text-anchor="middle" class="tiny">同一偏好更新旧记录，不无限追加</text>
<rect x="530" y="258" width="340" height="106" rx="14" fill="rgba(136,19,55,0.34)" stroke="#fb7185"/>
<text x="700" y="287" text-anchor="middle" class="label">中文 ID 坑</text>
<text x="700" y="314" text-anchor="middle" class="desc">只保留 ASCII 会让中文 subject 冲突</text>
<text x="700" y="336" text-anchor="middle" class="tiny">修复：保留中文 slug，并追加 sha1 digest</text>
<path d="M430 176 L530 168" class="line"/>
<path d="M430 348 L530 310" class="line"/>
<rect x="70" y="462" width="800" height="34" rx="17" fill="rgba(15,23,42,0.86)" stroke="#334155"/>
<text x="470" y="484" text-anchor="middle" class="desc">聊天历史是追加式的；长期记忆必须是可更新、可检索、可治理的结构化记录。</text>
</svg>
