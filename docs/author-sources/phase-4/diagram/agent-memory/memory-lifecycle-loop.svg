<svg viewBox="0 0 980 560" xmlns="http://www.w3.org/2000/svg">
<style>
  @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&amp;display=swap');
  text { font-family: 'JetBrains Mono', 'Noto Sans SC', 'PingFang SC', sans-serif; }
  .title { fill:#f8fafc; font-size:18px; font-weight:700; }
  .subtitle { fill:#94a3b8; font-size:10px; }
  .label { fill:#f8fafc; font-size:12px; font-weight:700; }
  .desc { fill:#cbd5e1; font-size:9px; }
  .tiny { fill:#94a3b8; font-size:8px; }
  .badge { fill:#0f172a; stroke-width:1.2; }
  .line { fill:none; stroke:#64748b; stroke-width:1.4; marker-end:url(#arrow); }
  .dash { fill:none; stroke:#64748b; stroke-width:1.2; stroke-dasharray:5 4; marker-end:url(#arrow); }
</style>
<defs>
  <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
    <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e293b" stroke-width="0.55"/>
  </pattern>
  <marker id="arrow" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
    <polygon points="0 0, 10 3.5, 0 7" fill="#64748b"/>
  </marker>
  <marker id="arrow-cyan" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
    <polygon points="0 0, 10 3.5, 0 7" fill="#22d3ee"/>
  </marker>
  <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
    <feGaussianBlur stdDeviation="2.4" result="blur"/>
    <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
</defs><rect width="100%" height="100%" fill="#0f172a"/><rect width="100%" height="100%" fill="url(#grid)" opacity="0.7"/>
<text x="34" y="42" class="title">Memory Read / Write 生命周期</text><text x="34" y="62" class="subtitle">读在推理前，写在行动后；写入前必须经过策略门</text>
<g>
    <rect x="392" y="84" width="196" height="64" rx="10" fill="#0f172a"/>
    <rect x="392" y="84" width="196" height="64" rx="10" fill="rgba(8,51,68,0.42)" stroke="#22d3ee" stroke-width="1.5" filter="url(#glow)"/>
    <text x="490" y="110" text-anchor="middle" class="label">User Input</text>
    <text x="490" y="130" text-anchor="middle" class="desc">当前请求 / 多轮上下文</text>
  </g>
<g>
    <rect x="96" y="216" width="190" height="74" rx="10" fill="#0f172a"/>
    <rect x="96" y="216" width="190" height="74" rx="10" fill="rgba(120,53,15,0.35)" stroke="#fbbf24" stroke-width="1.5" filter="url(#glow)"/>
    <text x="191" y="242" text-anchor="middle" class="label">ShortTermState</text>
    <text x="191" y="262" text-anchor="middle" class="desc">goal / steps / observations</text>
  </g>
<g>
    <rect x="394" y="210" width="192" height="84" rx="10" fill="#0f172a"/>
    <rect x="394" y="210" width="192" height="84" rx="10" fill="rgba(6,78,59,0.42)" stroke="#34d399" stroke-width="1.5" filter="url(#glow)"/>
    <text x="490" y="236" text-anchor="middle" class="label">Memory Search</text>
    <text x="490" y="256" text-anchor="middle" class="desc">按 query 召回相关长期记忆</text>
  </g>
<g>
    <rect x="690" y="216" width="190" height="74" rx="10" fill="#0f172a"/>
    <rect x="690" y="216" width="190" height="74" rx="10" fill="rgba(8,51,68,0.42)" stroke="#22d3ee" stroke-width="1.5" filter="url(#glow)"/>
    <text x="785" y="242" text-anchor="middle" class="label">LLM / Agent</text>
    <text x="785" y="262" text-anchor="middle" class="desc">推理、计划、工具调用</text>
  </g>
<g transform="translate(490,390)">
  <polygon points="0,-50 74,0 0,50 -74,0" fill="#0f172a"/>
  <polygon points="0,-50 74,0 0,50 -74,0" fill="rgba(120,53,15,0.38)" stroke="#fbbf24" stroke-width="1.6"/>
  <text y="-5" text-anchor="middle" class="label">MemoryPolicy</text>
  <text y="13" text-anchor="middle" class="desc">值得长期保留？</text>
</g>
<g>
    <rect x="692" y="360" width="190" height="74" rx="10" fill="#0f172a"/>
    <rect x="692" y="360" width="190" height="74" rx="10" fill="rgba(76,29,149,0.42)" stroke="#a78bfa" stroke-width="1.5" filter="url(#glow)"/>
    <text x="787" y="386" text-anchor="middle" class="label">JsonMemoryStore</text>
    <text x="787" y="406" text-anchor="middle" class="desc">preference / entity / task</text>
  </g>
<path d="M490 148 L490 210" class="line"/>
<path d="M392 126 L191 126 L191 216" class="dash"/>
<path d="M586 252 L690 252" class="line"/>
<path d="M785 290 L785 360" class="line"/>
<path d="M690 397 L564 397" class="line"/>
<path d="M416 397 L286 260" class="dash"/>
<path d="M692 397 C615 472 364 472 252 290" fill="none" stroke="#a78bfa" stroke-width="1.5" stroke-dasharray="6 4" marker-end="url(#arrow)"/>
<text x="615" y="236" class="tiny">召回后注入上下文</text>
<text x="808" y="334" class="tiny">行动后沉淀</text>
<text x="318" y="404" class="tiny" fill="#fb7185">拒绝敏感 / 临时 / 不稳定内容</text>
<rect x="96" y="492" width="786" height="34" rx="17" fill="rgba(15,23,42,0.86)" stroke="#334155"/>
<text x="489" y="514" text-anchor="middle" class="desc">不要让模型“自己觉得该记什么”：写入长期记忆前必须有 policy，哪怕第一版只是规则。</text>
</svg>
