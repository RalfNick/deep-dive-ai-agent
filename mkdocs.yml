site_name: 深入浅出 AI Agent
site_description: 从大模型基础到 AI Agent 工程实践，包含逐章实验与证据边界
site_url: https://ralfnick.github.io/deep-dive-ai-agent/
repo_url: https://github.com/RalfNick/deep-dive-ai-agent
repo_name: RalfNick/deep-dive-ai-agent
edit_uri: edit/main/
docs_dir: _web
site_dir: site
strict: true

theme:
  name: material
  language: zh
  features:
    - content.code.copy
    - navigation.footer
    - navigation.indexes
    - navigation.sections
    - navigation.top
    - search.highlight
    - search.suggest
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: blue
      toggle:
        icon: material/brightness-7
        name: 切换到深色模式
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: blue
      toggle:
        icon: material/brightness-4
        name: 切换到浅色模式

plugins:
  - search:
      lang:
        - zh
        - en

markdown_extensions:
  - admonition
  - attr_list
  - footnotes
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences

nav:
  - 首页: index.md
  - 中文正文:
      - 阅读说明: book/index.md
      - 全书介绍: book/introduction.md
      - 第 1 章 大模型入门: book/chapter1.md
      - 第 2 章 训练、对齐与推理: book/chapter2.md
      - 第 3 章 从一次生成到闭环执行: book/chapter3.md
      - 第 4 章 Harness Engineering: book/chapter4.md
      - 第 5 章 上下文工程: book/chapter5.md
      - 第 6 章 长任务中的上下文架构: book/chapter6.md
      - 18 章写作地图: book/OUTLINE.md
  - 配套实验:
      - 第 1 章实验: chapter1/index.md
      - 第 2 章实验: chapter2/index.md
      - 第 3 章实验: chapter3/index.md
      - 第 4 章实验: chapter4/index.md
      - 第 5 章实验: chapter5/index.md
      - 第 6 章实验: chapter6/index.md
  - 验证与贡献:
      - 实验状态: docs/EXPERIMENT_STATUS.md
      - 发布规则: docs/RELEASES.md
      - 参与贡献: CONTRIBUTING.md
