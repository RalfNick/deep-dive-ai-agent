<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 960" role="img" aria-labelledby="title desc">
<title id="title">离线灰度：停止后保留证据</title>
<desc id="desc">稳定分桶4/12，不估计真实A/B收益；到期探针是显式新条件。</desc>
<defs><marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M 0 1 L 10 6 L 0 11 z" fill="#17365d"/></marker></defs>
<style>.label{font-family:"KaiTi","STKaiti","Microsoft YaHei",sans-serif;fill:#17365d}.small{font-family:"Microsoft YaHei",sans-serif;fill:#46617f}</style>
<rect width="1600" height="960" fill="#fbf5e8"/>
<rect x="24" y="24" width="1552" height="912" rx="34" fill="#fffdf7" stroke="#17365d" stroke-width="3"/>
<text class="label" text-anchor="middle" font-size="42" font-weight="700"><tspan x="800.0" y="92.0">离线灰度：停止后保留证据</tspan></text>
<text class="label" text-anchor="middle" font-size="21" font-weight="400"><tspan x="800.0" y="150.0">稳定分桶4/12，不估计真实A/B收益；到期探针是显式新条件。</tspan></text>
<path d="M 340.0 445.0 L 440.0 295.0" fill="none" stroke="#59636e" stroke-width="4" stroke-linecap="round" marker-end="url(#arrow)"/>
<rect x="345.0" y="335.0" width="90" height="32" rx="12" fill="#fffdf7" opacity="0.94"/>
<text class="label" text-anchor="middle" font-size="18" font-weight="500"><tspan x="390.0" y="358.0">12</tspan></text>
<path d="M 340.0 445.0 L 440.0 635.0" fill="none" stroke="#287a4b" stroke-width="4" stroke-linecap="round" marker-end="url(#arrow)"/>
<rect x="345.0" y="505.0" width="90" height="32" rx="12" fill="#fffdf7" opacity="0.94"/>
<text class="label" text-anchor="middle" font-size="18" font-weight="500"><tspan x="390.0" y="528.0">4</tspan></text>
<path d="M 740.0 635.0 L 880.0 635.0" fill="none" stroke="#c46b18" stroke-width="4" stroke-linecap="round" marker-end="url(#arrow)"/>
<rect x="765.0" y="600.0" width="90" height="32" rx="12" fill="#fffdf7" opacity="0.94"/>
<text class="label" text-anchor="middle" font-size="18" font-weight="500"><tspan x="810.0" y="623.0">检测</tspan></text>
<path d="M 1170.0 635.0 L 1250.0 635.0" fill="none" stroke="#b8443b" stroke-width="4" stroke-linecap="round" marker-end="url(#arrow)"/>
<rect x="1165.0" y="600.0" width="90" height="32" rx="12" fill="#fffdf7" opacity="0.94"/>
<text class="label" text-anchor="middle" font-size="18" font-weight="500"><tspan x="1210.0" y="623.0">停止</tspan></text>
<path d="M 1185.0 360.0 L 1400.0 570.0" fill="none" stroke="#6846a5" stroke-width="4" stroke-linecap="round" marker-end="url(#arrow)" stroke-dasharray="10 9"/>
<rect x="1247.5" y="430.0" width="90" height="32" rx="12" fill="#fffdf7" opacity="0.94"/>
<text class="label" text-anchor="middle" font-size="18" font-weight="500"><tspan x="1292.5" y="453.0">继续过滤</tspan></text>
<rect x="60" y="380" width="280" height="130" rx="24" fill="#dceeff" stroke="#155b9a" stroke-width="4"/>
<text class="label" text-anchor="middle" font-size="25" font-weight="600"><tspan x="200.0" y="430.0">seed 1601</tspan><tspan x="200.0" y="461.2">稳定请求分桶</tspan></text>
<rect x="440" y="230" width="300" height="130" rx="24" fill="#edf0f2" stroke="#59636e" stroke-width="4"/>
<text class="label" text-anchor="middle" font-size="25" font-weight="600"><tspan x="590.0" y="280.0">基线 12</tspan><tspan x="590.0" y="311.2">继续旧版本</tspan></text>
<rect x="440" y="570" width="300" height="130" rx="24" fill="#dff3e4" stroke="#287a4b" stroke-width="4"/>
<text class="label" text-anchor="middle" font-size="25" font-weight="600"><tspan x="590.0" y="620.0">候选 4</tspan><tspan x="590.0" y="651.2">有批准版本</tspan></text>
<rect x="880" y="570" width="290" height="130" rx="24" fill="#fff0d8" stroke="#c46b18" stroke-width="4"/>
<text class="label" text-anchor="middle" font-size="25" font-weight="600"><tspan x="1025.0" y="620.0">推进时钟</tspan><tspan x="1025.0" y="651.2">过期探针失败</tspan></text>
<rect x="1250" y="570" width="300" height="130" rx="24" fill="#fde3df" stroke="#b8443b" stroke-width="4"/>
<text class="label" text-anchor="middle" font-size="25" font-weight="600"><tspan x="1400.0" y="620.0">stop → rollback</tspan><tspan x="1400.0" y="651.2">已知历史指针</tspan></text>
<rect x="850" y="230" width="670" height="130" rx="24" fill="#ece3fa" stroke="#6846a5" stroke-width="4"/>
<text class="label" text-anchor="middle" font-size="25" font-weight="600"><tspan x="1185.0" y="280.0">当前 UsePolicy + 时钟</tspan><tspan x="1185.0" y="311.2">回滚不能恢复撤销许可</tspan></text>
<rect x="850" y="710" width="670" height="100" rx="24" fill="#edf0f2" stroke="#59636e" stroke-width="4"/>
<text class="label" text-anchor="middle" font-size="25" font-weight="600"><tspan x="1185.0" y="745.0">外部副作用不能撤回</tspan><tspan x="1185.0" y="776.2">历史审计不删除</tspan></text>
<rect x="150" y="825" width="1300" height="70" rx="20" fill="#fff7c9" stroke="#9d7510" stroke-width="3"/>
<text class="label" text-anchor="middle" font-size="22" font-weight="600"><tspan x="800.0" y="862.0">回滚不洗白失效资产、不擦除发布历史，也不代替外部副作用补偿。</tspan></text>
</svg>
