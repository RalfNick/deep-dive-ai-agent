<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 960" role="img" aria-labelledby="title desc">
<title id="title">候选晋级：材料绑定，三态门禁</title>
<desc id="desc">通过验收仍须审批；改变条件不能复用旧批准。</desc>
<defs><marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M 0 1 L 10 6 L 0 11 z" fill="#17365d"/></marker></defs>
<style>.label{font-family:"KaiTi","STKaiti","Microsoft YaHei",sans-serif;fill:#17365d}.small{font-family:"Microsoft YaHei",sans-serif;fill:#46617f}</style>
<rect width="1600" height="960" fill="#fbf5e8"/>
<rect x="24" y="24" width="1552" height="912" rx="34" fill="#fffdf7" stroke="#17365d" stroke-width="3"/>
<text class="label" text-anchor="middle" font-size="42" font-weight="700"><tspan x="800.0" y="92.0">候选晋级：材料绑定，三态门禁</tspan></text>
<text class="label" text-anchor="middle" font-size="21" font-weight="400"><tspan x="800.0" y="150.0">通过验收仍须审批；改变条件不能复用旧批准。</tspan></text>
<path d="M 320.0 355.0 L 440.0 355.0" fill="none" stroke="#155b9a" stroke-width="4" stroke-linecap="round" marker-end="url(#arrow)"/>
<path d="M 760.0 355.0 L 850.0 355.0" fill="none" stroke="#287a4b" stroke-width="4" stroke-linecap="round" marker-end="url(#arrow)"/>
<rect x="760.0" y="320.0" width="90" height="32" rx="12" fill="#fffdf7" opacity="0.94"/>
<text class="label" text-anchor="middle" font-size="18" font-weight="500"><tspan x="805.0" y="343.0">pass</tspan></text>
<path d="M 1180.0 355.0 L 1260.0 355.0" fill="none" stroke="#287a4b" stroke-width="4" stroke-linecap="round" marker-end="url(#arrow)"/>
<rect x="1175.0" y="320.0" width="90" height="32" rx="12" fill="#fffdf7" opacity="0.94"/>
<text class="label" text-anchor="middle" font-size="18" font-weight="500"><tspan x="1220.0" y="343.0">授权</tspan></text>
<path d="M 600.0 420.0 L 600.0 640.0" fill="none" stroke="#b8443b" stroke-width="4" stroke-linecap="round" marker-end="url(#arrow)"/>
<rect x="555.0" y="495.0" width="90" height="32" rx="12" fill="#fffdf7" opacity="0.94"/>
<text class="label" text-anchor="middle" font-size="18" font-weight="500"><tspan x="600.0" y="518.0">缺失/违规</tspan></text>
<path d="M 1395.0 420.0 L 1185.0 640.0" fill="none" stroke="#c46b18" stroke-width="4" stroke-linecap="round" marker-end="url(#arrow)"/>
<rect x="1245.0" y="495.0" width="90" height="32" rx="12" fill="#fffdf7" opacity="0.94"/>
<text class="label" text-anchor="middle" font-size="18" font-weight="500"><tspan x="1290.0" y="518.0">变更</tspan></text>
<path d="M 950.0 705.0 Q 916.5 496.6 760.0 355.0" fill="none" stroke="#6846a5" stroke-width="4" stroke-linecap="round" marker-end="url(#arrow)" stroke-dasharray="10 9"/>
<rect x="871.5" y="461.6" width="90" height="32" rx="12" fill="#fffdf7" opacity="0.94"/>
<text class="label" text-anchor="middle" font-size="18" font-weight="500"><tspan x="916.5" y="484.6">新证据</tspan></text>
<rect x="60" y="290" width="260" height="130" rx="24" fill="#ece3fa" stroke="#6846a5" stroke-width="4"/>
<text class="label" text-anchor="middle" font-size="25" font-weight="600"><tspan x="190.0" y="340.0">有范围候选</tspan><tspan x="190.0" y="371.2">未批准</tspan></text>
<rect x="440" y="290" width="320" height="130" rx="24" fill="#dceeff" stroke="#155b9a" stroke-width="4"/>
<text class="label" text-anchor="middle" font-size="25" font-weight="600"><tspan x="600.0" y="340.0">独立验收</tspan><tspan x="600.0" y="371.2">安全 → 证据 → 回归</tspan></text>
<rect x="850" y="290" width="330" height="130" rx="24" fill="#fff0d8" stroke="#c46b18" stroke-width="4"/>
<text class="label" text-anchor="middle" font-size="25" font-weight="600"><tspan x="1015.0" y="340.0">可信批准入口</tspan><tspan x="1015.0" y="371.2">绑定候选 / 证据 / 上下文</tspan></text>
<rect x="1260" y="290" width="270" height="130" rx="24" fill="#dff3e4" stroke="#287a4b" stroke-width="4"/>
<text class="label" text-anchor="middle" font-size="25" font-weight="600"><tspan x="1395.0" y="340.0">激活指针</tspan><tspan x="1395.0" y="371.2">批准且未到期</tspan></text>
<rect x="420" y="640" width="360" height="130" rx="24" fill="#fde3df" stroke="#b8443b" stroke-width="4"/>
<text class="label" text-anchor="middle" font-size="25" font-weight="600"><tspan x="600.0" y="690.0">fail / inconclusive</tspan><tspan x="600.0" y="721.2">拒绝 / 补证据</tspan></text>
<rect x="950" y="640" width="470" height="130" rx="24" fill="#ece3fa" stroke="#6846a5" stroke-width="4"/>
<text class="label" text-anchor="middle" font-size="25" font-weight="600"><tspan x="1185.0" y="690.0">内容或条件变化</tspan><tspan x="1185.0" y="721.2">重新验证</tspan></text>
<rect x="150" y="825" width="1300" height="70" rx="20" fill="#fff7c9" stroke="#9d7510" stroke-width="3"/>
<text class="label" text-anchor="middle" font-size="22" font-weight="600"><tspan x="800.0" y="862.0">批准的是完整材料身份与范围，不是一个可重复使用的“同意”。</tspan></text>
</svg>
