<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 960" role="img" aria-labelledby="title desc">
<title id="title">实时语音：两条时间线不能合并</title>
<desc id="desc">用户开始说话，播报可以停；后台任务要看独立事件。</desc>
<defs><marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M 0 1 L 10 6 L 0 11 z" fill="#17365d"/></marker></defs>
<style>.label{font-family:"KaiTi","STKaiti","Microsoft YaHei",sans-serif;fill:#17365d}.small{font-family:"Microsoft YaHei",sans-serif;fill:#46617f}</style>
<rect width="1600" height="960" fill="#fbf5e8"/>
<rect x="24" y="24" width="1552" height="912" rx="34" fill="#fffdf7" stroke="#17365d" stroke-width="3"/>
<text class="label" text-anchor="middle" font-size="42" font-weight="700"><tspan x="800.0" y="92.0">实时语音：两条时间线不能合并</tspan></text>
<text class="label" text-anchor="middle" font-size="21" font-weight="400"><tspan x="800.0" y="150.0">用户开始说话，播报可以停；后台任务要看独立事件。</tspan></text>
<path d="M 400.0 300.0 L 490.0 300.0" fill="none" stroke="#155b9a" stroke-width="4" stroke-linecap="round" marker-end="url(#arrow)"/>
<path d="M 830.0 300.0 L 1010.0 300.0" fill="none" stroke="#155b9a" stroke-width="4" stroke-linecap="round" marker-end="url(#arrow)"/>
<path d="M 400.0 620.0 L 490.0 620.0" fill="none" stroke="#287a4b" stroke-width="4" stroke-linecap="round" marker-end="url(#arrow)"/>
<rect x="400.0" y="585.0" width="90" height="32" rx="12" fill="#fffdf7" opacity="0.94"/>
<text class="label" text-anchor="middle" font-size="18" font-weight="500"><tspan x="445.0" y="608.0">另一条线</tspan></text>
<path d="M 830.0 620.0 L 1010.0 620.0" fill="none" stroke="#155b9a" stroke-width="4" stroke-linecap="round" marker-end="url(#arrow)"/>
<path d="M 230.0 360.0 Q 310.0 460.0 230.0 560.0" fill="none" stroke="#b8443b" stroke-width="4" stroke-linecap="round" marker-end="url(#arrow)" stroke-dasharray="10 9"/>
<rect x="265.0" y="425.0" width="90" height="32" rx="12" fill="#fffdf7" opacity="0.94"/>
<text class="label" text-anchor="middle" font-size="18" font-weight="500"><tspan x="310.0" y="448.0">不等于取消</tspan></text>
<rect x="60" y="240" width="340" height="120" rx="24" fill="#dceeff" stroke="#155b9a" stroke-width="4"/>
<text class="label" text-anchor="middle" font-size="25" font-weight="600"><tspan x="230.0" y="300.0">用户 speech_started</tspan></text>
<rect x="490" y="240" width="340" height="120" rx="24" fill="#ece3fa" stroke="#6846a5" stroke-width="4"/>
<text class="label" text-anchor="middle" font-size="25" font-weight="600"><tspan x="660.0" y="285.0">response_cancelled</tspan><tspan x="660.0" y="316.2">停止生成请求</tspan></text>
<rect x="1010" y="240" width="430" height="120" rx="24" fill="#fff0d8" stroke="#c46b18" stroke-width="4"/>
<text class="label" text-anchor="middle" font-size="25" font-weight="600"><tspan x="1225.0" y="285.0">playback_stopped</tspan><tspan x="1225.0" y="316.2">扬声器不再播</tspan></text>
<rect x="60" y="560" width="340" height="120" rx="24" fill="#dff3e4" stroke="#287a4b" stroke-width="4"/>
<text class="label" text-anchor="middle" font-size="25" font-weight="600"><tspan x="230.0" y="605.0">task_started</tspan><tspan x="230.0" y="636.2">后台仍 running</tspan></text>
<rect x="490" y="560" width="340" height="120" rx="24" fill="#fff0d8" stroke="#c46b18" stroke-width="4"/>
<text class="label" text-anchor="middle" font-size="25" font-weight="600"><tspan x="660.0" y="605.0">action_committed</tspan><tspan x="660.0" y="636.2">副作用已发生</tspan></text>
<rect x="1010" y="560" width="430" height="120" rx="24" fill="#dff3e4" stroke="#287a4b" stroke-width="4"/>
<text class="label" text-anchor="middle" font-size="25" font-weight="600"><tspan x="1225.0" y="605.0">task_completed</tspan><tspan x="1225.0" y="636.2">迟来的 cancel 不撤销</tspan></text>
<rect x="150" y="825" width="1300" height="70" rx="20" fill="#fff7c9" stroke="#9d7510" stroke-width="3"/>
<text class="label" text-anchor="middle" font-size="22" font-weight="600"><tspan x="800.0" y="862.0">停播、截断上下文、取消后台任务和补偿副作用，是四个不同动作。</tspan></text>
</svg>
