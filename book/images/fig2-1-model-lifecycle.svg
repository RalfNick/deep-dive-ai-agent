<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">一个可用大模型的四段生命周期</title>
  <desc id="desc">预训练获得基础能力，监督微调塑造示范行为，偏好或强化学习调整选择倾向，推理系统在每次请求中分配上下文、计算和工具。</desc>
  <defs>
    <filter id="s"><feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#0F172A" flood-opacity=".10"/></filter>
    <marker id="a" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0L12 6L0 12Z" fill="#64748B"/></marker>
    <style>.f{font-family:"Microsoft YaHei","PingFang SC",sans-serif}.t{font-size:44px;font-weight:700;fill:#0F172A}.st{font-size:21px;fill:#475569}.h{font-size:28px;font-weight:700;fill:#0F172A}.p{font-size:19px;fill:#475569}.n{font-size:19px;font-weight:700}</style>
  </defs>
  <rect width="1600" height="900" rx="32" fill="#F8FAFC"/>
  <g class="f">
    <text x="80" y="88" class="t">同一套“生成下一 Token”机制，被四段工程塑造成可用模型</text>
    <text x="80" y="130" class="st">前三段改变参数或策略倾向；最后一段在请求时改变上下文、计算预算与可执行能力</text>
    <g filter="url(#s)">
      <rect x="70" y="250" width="310" height="350" rx="28" fill="#EEF2FF" stroke="#6366F1" stroke-width="3"/>
      <circle cx="125" cy="310" r="30" fill="#4F46E5"/><text x="125" y="320" text-anchor="middle" font-size="24" font-weight="700" fill="white">1</text>
      <text x="175" y="319" class="h">预训练</text>
      <text x="110" y="390" class="p">海量原始 Token</text><text x="110" y="430" class="p">下一 Token 预测</text><text x="110" y="470" class="p">语言、知识与模式</text>
      <rect x="108" y="520" width="235" height="48" rx="14" fill="#4F46E5"/><text x="225" y="551" text-anchor="middle" class="n" fill="white">回答“可能接什么”</text>
    </g>
    <path d="M380 425H430" stroke="#64748B" stroke-width="4" marker-end="url(#a)"/>
    <g filter="url(#s)">
      <rect x="430" y="250" width="310" height="350" rx="28" fill="#ECFEFF" stroke="#06B6D4" stroke-width="3"/>
      <circle cx="485" cy="310" r="30" fill="#0891B2"/><text x="485" y="320" text-anchor="middle" font-size="24" font-weight="700" fill="white">2</text>
      <text x="535" y="319" class="h">监督微调</text>
      <text x="470" y="390" class="p">精选指令与示范</text><text x="470" y="430" class="p">回答/工具调用模板</text><text x="470" y="470" class="p">角色与格式边界</text>
      <rect x="468" y="520" width="235" height="48" rx="14" fill="#0891B2"/><text x="585" y="551" text-anchor="middle" class="n" fill="white">学会“应该怎么答”</text>
    </g>
    <path d="M740 425H790" stroke="#64748B" stroke-width="4" marker-end="url(#a)"/>
    <g filter="url(#s)">
      <rect x="790" y="250" width="310" height="350" rx="28" fill="#FFF7ED" stroke="#F97316" stroke-width="3"/>
      <circle cx="845" cy="310" r="30" fill="#EA580C"/><text x="845" y="320" text-anchor="middle" font-size="24" font-weight="700" fill="white">3</text>
      <text x="895" y="319" class="h">偏好 / RL</text>
      <text x="830" y="390" class="p">比较、规则或验证器</text><text x="830" y="430" class="p">奖励与 KL 约束</text><text x="830" y="470" class="p">安全、风格、推理</text>
      <rect x="828" y="520" width="235" height="48" rx="14" fill="#EA580C"/><text x="945" y="551" text-anchor="middle" class="n" fill="white">更偏向“较好选择”</text>
    </g>
    <path d="M1100 425H1150" stroke="#64748B" stroke-width="4" marker-end="url(#a)"/>
    <g filter="url(#s)">
      <rect x="1150" y="220" width="380" height="410" rx="28" fill="#F0FDF4" stroke="#22C55E" stroke-width="3"/>
      <circle cx="1205" cy="280" r="30" fill="#16A34A"/><text x="1205" y="290" text-anchor="middle" font-size="24" font-weight="700" fill="white">4</text>
      <text x="1255" y="289" class="h">推理系统 / API</text>
      <text x="1192" y="365" class="p">上下文与会话状态</text><text x="1192" y="405" class="p">采样与推理预算</text><text x="1192" y="445" class="p">结构化输出与工具</text><text x="1192" y="485" class="p">超时、权限与验证</text>
      <rect x="1190" y="550" width="300" height="48" rx="14" fill="#16A34A"/><text x="1340" y="581" text-anchor="middle" class="n" fill="white">决定“这次怎样完成任务”</text>
    </g>
    <rect x="180" y="730" width="1240" height="85" rx="24" fill="#0F172A"/>
    <text x="800" y="766" text-anchor="middle" font-size="21" font-weight="700" fill="white">后训练不是把事实写成规则；推理系统也不是再次训练</text>
    <text x="800" y="798" text-anchor="middle" font-size="18" fill="#CBD5E1">先问“改变了参数、偏好，还是只改变本次请求”，概念就不会混在一起</text>
  </g>
</svg>
