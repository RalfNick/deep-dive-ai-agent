<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675">
  <defs>
    <style>.t{font-family:'Microsoft YaHei',sans-serif;fill:#172033}.h{font-size:34px;font-weight:700}.s{font-size:18px;fill:#5d6b82}.k{font-size:18px;font-weight:700}.b{font-size:15px}</style>
    <marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#64748b"/></marker>
  </defs>
  <rect width="1200" height="675" rx="24" fill="#f8fafc"/>
  <text x="70" y="72" class="t h">一张图看懂 Harness：六个责任面怎样连接</text>
  <text x="70" y="108" class="t s">输入、行动、环境、状态、验证和记录共同决定一次运行的真实结果</text>
  <rect x="64" y="170" width="190" height="90" rx="18" fill="#e8edff" stroke="#91a8ed" stroke-width="2"/>
  <text x="159" y="205" text-anchor="middle" class="t k">Context Builder</text><text x="159" y="233" text-anchor="middle" class="t b">目标 · 指令 · 环境投影</text>
  <rect x="296" y="170" width="180" height="90" rx="18" fill="#edf3ff" stroke="#91a8ed" stroke-width="2"/>
  <text x="386" y="205" text-anchor="middle" class="t k">Model / Policy</text><text x="386" y="233" text-anchor="middle" class="t b">提出下一步候选</text>
  <rect x="518" y="148" width="202" height="134" rx="20" fill="#172b5b"/>
  <text x="619" y="190" text-anchor="middle" font-family="Microsoft YaHei" font-size="19" font-weight="700" fill="#fff">Action Gateway</text><text x="619" y="220" text-anchor="middle" font-family="Microsoft YaHei" font-size="15" fill="#d6e1f6">Required args · Policy</text><text x="619" y="247" text-anchor="middle" font-family="Microsoft YaHei" font-size="15" fill="#d6e1f6">allow / deny / ask</text>
  <rect x="762" y="170" width="180" height="90" rx="18" fill="#eaf8f8" stroke="#72c3cc" stroke-width="2"/>
  <text x="852" y="205" text-anchor="middle" class="t k">Enforcement</text><text x="852" y="233" text-anchor="middle" class="t b">Path Guard · 系统 Sandbox</text>
  <rect x="984" y="170" width="160" height="90" rx="18" fill="#fff2e8" stroke="#efaa79" stroke-width="2"/>
  <text x="1064" y="205" text-anchor="middle" class="t k">Environment</text><text x="1064" y="233" text-anchor="middle" class="t b">真实世界状态</text>
  <path d="M254 215 H288" stroke="#64748b" stroke-width="3" marker-end="url(#a)"/><path d="M476 215 H510" stroke="#64748b" stroke-width="3" marker-end="url(#a)"/><path d="M720 215 H754" stroke="#64748b" stroke-width="3" marker-end="url(#a)"/><path d="M942 215 H976" stroke="#64748b" stroke-width="3" marker-end="url(#a)"/>
  <rect x="120" y="370" width="250" height="116" rx="20" fill="#fff" stroke="#9eb2ef" stroke-width="2"/>
  <text x="245" y="410" text-anchor="middle" class="t k">State Store</text><text x="245" y="440" text-anchor="middle" class="t b">检查点 · 待审批动作</text><text x="245" y="466" text-anchor="middle" class="t b">回执 · 预算 · 状态版本</text>
  <rect x="475" y="370" width="250" height="116" rx="20" fill="#fff" stroke="#72c3cc" stroke-width="2"/>
  <text x="600" y="410" text-anchor="middle" class="t k">Verifier</text><text x="600" y="440" text-anchor="middle" class="t b">测试 · 约束 · 人工验收</text><text x="600" y="466" text-anchor="middle" class="t b">完成证据绑定状态摘要</text>
  <rect x="830" y="370" width="250" height="116" rx="20" fill="#fff" stroke="#efaa79" stroke-width="2"/>
  <text x="955" y="410" text-anchor="middle" class="t k">Recorder</text><text x="955" y="440" text-anchor="middle" class="t b">事件序号 · cause_id</text><text x="955" y="466" text-anchor="middle" class="t b">重放 · 审计 · 指标</text>
  <path d="M619 282 V330 H245 V362" fill="none" stroke="#3157d5" stroke-width="3" marker-end="url(#a)"/><path d="M1064 260 V330 H600 V362" fill="none" stroke="#0a91aa" stroke-width="3" marker-end="url(#a)"/><path d="M852 260 V318 H955 V362" fill="none" stroke="#d97745" stroke-width="3" marker-end="url(#a)"/>
  <path d="M600 486 V530 H386 V268" fill="none" stroke="#0a91aa" stroke-width="3" stroke-dasharray="8 6" marker-end="url(#a)"/>
  <rect x="190" y="558" width="820" height="58" rx="20" fill="#172b5b"/>
  <text x="600" y="594" text-anchor="middle" font-family="Microsoft YaHei" font-size="17" fill="#fff">继续、暂停、完成、失败或停止，都是 Harness 根据状态与证据作出的转移</text>
</svg>
