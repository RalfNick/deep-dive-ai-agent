<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">从模型服务到三种 AI 应用模式</title>
  <desc id="desc">模型经模型服务进入 AI 应用；应用可以采用单次调用、固定工作流或由模型动态决定路径的 Agent 模式。</desc>
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#0F172A" flood-opacity=".10"/>
    </filter>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0,0 L12,6 L0,12 Z" fill="#64748B"/>
    </marker>
    <style>
      .font{font-family:"Microsoft YaHei","PingFang SC","Noto Sans CJK SC",sans-serif}
      .title{font-size:44px;font-weight:700;fill:#0F172A}
      .sub{font-size:21px;fill:#475569}
      .h{font-size:26px;font-weight:700;fill:#0F172A}
      .p{font-size:18px;fill:#475569}
      .tag{font-size:17px;font-weight:700}
    </style>
  </defs>
  <rect width="1600" height="900" rx="32" fill="#F8FAFC"/>
  <g class="font">
    <text x="82" y="86" class="title">Agent 不是“第四层”，而是 AI 应用的一种架构模式</text>
    <text x="82" y="126" class="sub">模型提供下一步输出；应用决定怎样组织调用、工具、状态与验证</text>

    <g filter="url(#shadow)">
      <rect x="80" y="280" width="285" height="330" rx="28" fill="#EEF2FF" stroke="#6366F1" stroke-width="3"/>
      <circle cx="137" cy="339" r="31" fill="#4F46E5"/>
      <text x="137" y="349" text-anchor="middle" font-size="24" font-weight="700" fill="#FFFFFF">1</text>
      <text x="190" y="348" class="h">模型</text>
      <text x="120" y="420" class="p">输入：Token / Tensor</text>
      <text x="120" y="459" class="p">计算：Transformer 前向</text>
      <text x="120" y="498" class="p">输出：Logits / 结构</text>
      <rect x="116" y="535" width="213" height="48" rx="14" fill="#4F46E5"/>
      <text x="222" y="566" text-anchor="middle" class="tag" fill="#FFFFFF">本身不执行外部动作</text>
    </g>

    <path d="M365 445 H425" stroke="#64748B" stroke-width="4" marker-end="url(#arrow)"/>

    <g filter="url(#shadow)">
      <rect x="425" y="250" width="320" height="390" rx="28" fill="#ECFEFF" stroke="#06B6D4" stroke-width="3"/>
      <circle cx="482" cy="309" r="31" fill="#0891B2"/>
      <text x="482" y="319" text-anchor="middle" font-size="24" font-weight="700" fill="#FFFFFF">2</text>
      <text x="535" y="318" class="h">模型服务/API</text>
      <text x="468" y="392" class="p">托管、鉴权与调度</text>
      <text x="468" y="431" class="p">请求与响应协议</text>
      <text x="468" y="470" class="p">流式输出与配额</text>
      <text x="468" y="509" class="p">可选的托管工具</text>
      <rect x="466" y="558" width="238" height="48" rx="14" fill="#CFFAFE"/>
      <text x="585" y="589" text-anchor="middle" class="tag" fill="#0E7490">把模型变成可调用服务</text>
    </g>

    <path d="M745 445 H805" stroke="#64748B" stroke-width="4" marker-end="url(#arrow)"/>

    <g filter="url(#shadow)">
      <rect x="805" y="178" width="715" height="535" rx="30" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="3"/>
      <text x="855" y="236" class="h">3　AI 应用：三种常见组织方式</text>

      <rect x="855" y="276" width="615" height="105" rx="20" fill="#FFF7ED" stroke="#FB923C" stroke-width="2"/>
      <text x="890" y="318" class="h">单次调用</text>
      <text x="890" y="353" class="p">应用拼装输入 → 调用一次模型 → 展示结果</text>
      <rect x="1308" y="301" width="125" height="42" rx="13" fill="#FFEDD5"/>
      <text x="1370" y="329" text-anchor="middle" class="tag" fill="#C2410C">代码定路径</text>

      <rect x="855" y="407" width="615" height="105" rx="20" fill="#F0FDF4" stroke="#22C55E" stroke-width="2"/>
      <text x="890" y="449" class="h">Workflow</text>
      <text x="890" y="484" class="p">按预定义步骤调用模型、数据和工具</text>
      <rect x="1308" y="432" width="125" height="42" rx="13" fill="#DCFCE7"/>
      <text x="1370" y="460" text-anchor="middle" class="tag" fill="#15803D">代码定路径</text>

      <rect x="855" y="538" width="615" height="135" rx="20" fill="#EEF2FF" stroke="#6366F1" stroke-width="3"/>
      <text x="890" y="580" class="h">Agent</text>
      <text x="890" y="615" class="p">观察 → 模型决策 → 工具 → 验证 → 再决策</text>
      <text x="890" y="648" class="p">工具可以只读，也可以在权限内改变环境</text>
      <rect x="1270" y="572" width="163" height="48" rx="14" fill="#4F46E5"/>
      <text x="1351" y="603" text-anchor="middle" class="tag" fill="#FFFFFF">模型动态定路径</text>
    </g>

    <rect x="190" y="777" width="1220" height="70" rx="22" fill="#0F172A"/>
    <text x="800" y="820" text-anchor="middle" font-size="22" font-weight="700" fill="#FFFFFF">比较 Agent 产品：既看模型，也看 Harness、工具、环境与验证</text>
  </g>
</svg>
