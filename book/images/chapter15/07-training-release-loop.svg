<polygon points="1305.0,270 1440,340.0 1305.0,410 1170,340.0" fill="#fff0d8" stroke="#c46b18" stroke-width="4" stroke-linejoin="round"/>
<text class="label" text-anchor="middle" font-size="25" font-weight="600"><tspan x="1305.0" y="325.0">4 Safety Gate</tspan><tspan x="1305.0" y="356.2">零违规 · 零污染</tspan></text>
