<path d="M 1130.0 635.0 L 1000.0 715.0" fill="none" stroke="#155b9a" stroke-width="4" stroke-linecap="round" marker-end="url(#arrow)"/>
<path d="M 730.0 715.0 L 590.0 660.0" fill="none" stroke="#b8443b" stroke-width="4" stroke-linecap="round" marker-end="url(#arrow)" stroke-dasharray="10 9"/>
<rect x="615.0" y="652.5" width="90" height="32" rx="12" fill="#fffdf7" opacity="0.94"/>
