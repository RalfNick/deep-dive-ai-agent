<rect x="300" y="590" width="290" height="140" rx="24" fill="#fde3df" stroke="#b8443b" stroke-width="4"/>
<text class="label" text-anchor="middle" font-size="25" font-weight="600"><tspan x="445.0" y="645.0">7 Rollback</tspan><tspan x="445.0" y="676.2">恢复模型与 Harness</tspan></text>
<rect x="150" y="825" width="1300" height="70" rx="20" fill="#fff7c9" stroke="#9d7510" stroke-width="3"/>
<text class="label" text-anchor="middle" font-size="22" font-weight="600"><tspan x="800.0" y="862.0">后训练不是一次离线作业，而是数据—训练—评测—灰度—回滚的版本化闭环。</tspan></text>
