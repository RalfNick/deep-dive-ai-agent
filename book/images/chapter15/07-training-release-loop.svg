<text class="label" text-anchor="middle" font-size="25" font-weight="600"><tspan x="205.0" y="355.0">1 Data Version</tspan><tspan x="205.0" y="386.2">来源 · 许可 · 切分</tspan></text>
<rect x="410" y="180" width="280" height="150" rx="24" fill="#ece3fa" stroke="#6846a5" stroke-width="4"/>
