<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 960" role="img" aria-labelledby="title desc">
<title id="title">SFT 概率变化：示范会被复制</title>
<desc id="desc">同一个损失函数不会知道示范是否符合安全意图。</desc>
<defs><marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M 0 1 L 10 6 L 0 11 z" fill="#17365d"/></marker></defs>
<style>.label{font-family:"KaiTi","STKaiti","Microsoft YaHei",sans-serif;fill:#17365d}.small{font-family:"Microsoft YaHei",sans-serif;fill:#46617f}</style>
<rect width="1600" height="960" fill="#fbf5e8"/>
<rect x="24" y="24" width="1552" height="912" rx="34" fill="#fffdf7" stroke="#17365d" stroke-width="3"/>
<text class="label" text-anchor="middle" font-size="42" font-weight="700"><tspan x="800.0" y="92.0">SFT 概率变化：示范会被复制</tspan></text>
<text class="label" text-anchor="middle" font-size="21" font-weight="400"><tspan x="800.0" y="150.0">同一个损失函数不会知道示范是否符合安全意图。</tspan></text>
<path d="M 440.0 445.0 L 560.0 275.0" fill="none" stroke="#155b9a" stroke-width="4" stroke-linecap="round" marker-end="url(#arrow)"/>
<path d="M 440.0 445.0 L 560.0 575.0" fill="none" stroke="#155b9a" stroke-width="4" stroke-linecap="round" marker-end="url(#arrow)"/>
<path d="M 900.0 275.0 L 1080.0 280.0" fill="none" stroke="#155b9a" stroke-width="4" stroke-linecap="round" marker-end="url(#arrow)"/>
<rect x="864.0" y="242.5" width="252" height="32" rx="12" fill="#fffdf7" opacity="0.94"/>
<text class="label" text-anchor="middle" font-size="18" font-weight="500"><tspan x="990.0" y="265.5">交叉熵 · lr = 0.5</tspan></text>
<path d="M 900.0 575.0 L 1080.0 560.0" fill="none" stroke="#b8443b" stroke-width="4" stroke-linecap="round" marker-end="url(#arrow)"/>
<rect x="936.0" y="532.5" width="108" height="32" rx="12" fill="#fffdf7" opacity="0.94"/>
<text class="label" text-anchor="middle" font-size="18" font-weight="500"><tspan x="990.0" y="555.5">相同更新规则</tspan></text>
<rect x="70" y="300" width="370" height="290" rx="24" fill="#dceeff" stroke="#155b9a" stroke-width="4"/>
<text class="label" text-anchor="middle" font-size="25" font-weight="600"><tspan x="255.0" y="385.0">1 write_requested</tspan><tspan x="255.0" y="416.2">初始分布</tspan><tspan x="255.0" y="447.5">read = 0.166667</tspan><tspan x="255.0" y="478.8">modify_tests = 0.166667</tspan><tspan x="255.0" y="510.0">其余 4 动作各 0.166667</tspan></text>
<rect x="560" y="200" width="340" height="150" rx="24" fill="#dff3e4" stroke="#287a4b" stroke-width="4"/>
<text class="label" text-anchor="middle" font-size="25" font-weight="600"><tspan x="730.0" y="260.0">2 审计通过的 traj-010</tspan><tspan x="730.0" y="291.2">Target = read</tspan></text>
<rect x="560" y="500" width="340" height="150" rx="24" fill="#fde3df" stroke="#b8443b" stroke-width="4"/>
<text class="label" text-anchor="middle" font-size="25" font-weight="600"><tspan x="730.0" y="560.0">3 故障注入：篡改标签</tspan><tspan x="730.0" y="591.2">Target = modify_tests</tspan></text>
<rect x="1080" y="180" width="450" height="200" rx="24" fill="#dff3e4" stroke="#287a4b" stroke-width="4"/>
<text class="label" text-anchor="middle" font-size="25" font-weight="600"><tspan x="1305.0" y="250.0">4 一步更新后</tspan><tspan x="1305.0" y="281.2">P(read) = 0.247976</tspan><tspan x="1305.0" y="312.5">其余 5 动作各 0.150405</tspan></text>
<rect x="1080" y="460" width="450" height="200" rx="24" fill="#fde3df" stroke="#b8443b" stroke-width="4"/>
<text class="label" text-anchor="middle" font-size="25" font-weight="600"><tspan x="1305.0" y="530.0">5 一步更新后</tspan><tspan x="1305.0" y="561.2">P(modify_tests) = 0.247976</tspan><tspan x="1305.0" y="592.5">其余 5 动作各 0.150405</tspan></text>
<rect x="460" y="700" width="1030" height="100" rx="24" fill="#ece3fa" stroke="#6846a5" stroke-width="4"/>
<text class="label" text-anchor="middle" font-size="25" font-weight="600"><tspan x="975.0" y="735.0">6 未覆盖状态：P(retry | tool_timeout) 仍为 0.166667</tspan><tspan x="975.0" y="766.2">本表策略不共享状态参数；不能外推神经网络的泛化</tspan></text>
<rect x="150" y="825" width="1300" height="70" rx="20" fill="#fff7c9" stroke="#9d7510" stroke-width="3"/>
<text class="label" text-anchor="middle" font-size="22" font-weight="600"><tspan x="800.0" y="862.0">SFT 忠实复制被保留的示范：数据审计不是训练前的可选清洁步骤。</tspan></text>
</svg>
