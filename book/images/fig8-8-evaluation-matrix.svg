<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">RAG 评估必须分层而不是压成总分</title>
  <desc id="desc">分别展示检索、引用、回答、治理和运行指标，并保留不可定义值。</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#071426"/><stop offset="1" stop-color="#111827"/></linearGradient>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#60a5fa"/></marker>
  </defs>
  <rect width="1200" height="675" rx="28" fill="url(#bg)"/>
  <g font-family="Microsoft YaHei, PingFang SC, sans-serif">
    <text x="56" y="65" fill="#f8fafc" font-size="36" font-weight="700">坏答案从哪里坏，要靠分层指标回答</text>
    <g font-size="22">
      <rect x="55" y="130" width="330" height="160" rx="22" fill="#111c33" stroke="#60a5fa" stroke-width="2"/>
      <text x="85" y="180" fill="#60a5fa" font-size="27" font-weight="700">检索</text><text x="85" y="225" fill="#e2e8f0">Precision@3 0.33</text><text x="85" y="263" fill="#e2e8f0">NDCG@3 1.00</text>
      <rect x="435" y="130" width="330" height="160" rx="22" fill="#111c33" stroke="#a78bfa" stroke-width="2"/>
      <text x="465" y="180" fill="#a78bfa" font-size="27" font-weight="700">引用</text><text x="465" y="225" fill="#e2e8f0">引用精确率 / 召回率</text><text x="465" y="263" fill="#e2e8f0">声明—来源映射</text>
      <rect x="815" y="130" width="330" height="160" rx="22" fill="#111c33" stroke="#34d399" stroke-width="2"/>
      <text x="845" y="180" fill="#34d399" font-size="27" font-weight="700">回答</text><text x="845" y="225" fill="#e2e8f0">支持声明比例</text><text x="845" y="263" fill="#e2e8f0">Answer / Partial / Abstain</text>
      <rect x="245" y="340" width="330" height="160" rx="22" fill="#111c33" stroke="#fbbf24" stroke-width="2"/>
      <text x="275" y="390" fill="#fbbf24" font-size="27" font-weight="700">治理</text><text x="275" y="435" fill="#e2e8f0">策略违规数</text><text x="275" y="473" fill="#e2e8f0">撤回候选拒绝数</text>
      <rect x="625" y="340" width="330" height="160" rx="22" fill="#111c33" stroke="#f472b6" stroke-width="2"/>
      <text x="655" y="390" fill="#f472b6" font-size="27" font-weight="700">未定义值</text><text x="655" y="435" fill="#e2e8f0">无相关项：MRR = null</text><text x="655" y="473" fill="#e2e8f0">不能偷换成 0</text>
    </g>
    <rect x="315" y="545" width="570" height="55" rx="27" fill="#172554"/><text x="430" y="580" fill="#dbeafe" font-size="24" font-weight="700">保留诊断维度，不压成一个总分</text>
    <text x="56" y="640" fill="#94a3b8" font-size="20">来源：S07、S12—S15｜展示值来自固定案例，sample_count = 1</text>
  </g>
</svg>
