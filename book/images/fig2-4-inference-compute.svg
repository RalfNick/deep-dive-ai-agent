<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">推理时计算的质量成本曲线</title>
  <desc id="desc">简单任务很快饱和，困难可解任务随预算增加而改善，不可解任务不会因为更多预算变正确；工程上应按任务路由预算。</desc>
  <defs><marker id="a" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0L12 6L0 12Z" fill="#475569"/></marker><style>.f{font-family:"Microsoft YaHei","PingFang SC",sans-serif}.t{font-size:44px;font-weight:700;fill:#0F172A}.st{font-size:21px;fill:#475569}.h{font-size:22px;font-weight:700}.p{font-size:18px;fill:#475569}</style></defs>
  <rect width="1600" height="900" rx="32" fill="#F8FAFC"/>
  <g class="f">
    <text x="80" y="88" class="t">更多推理预算不是“免费智力”，而是一条因任务而异的曲线</text>
    <text x="80" y="130" class="st">横轴可代表推理 Token、候选数、验证轮数或搜索节点；纵轴代表任务成功率</text>
    <path d="M180 710V230" stroke="#475569" stroke-width="4" marker-end="url(#a)"/><path d="M180 710H1120" stroke="#475569" stroke-width="4" marker-end="url(#a)"/>
    <text x="95" y="455" transform="rotate(-90 95 455)" font-size="22" font-weight="700" fill="#334155">任务成功率 / 质量</text><text x="540" y="775" font-size="22" font-weight="700" fill="#334155">推理时计算 / 延迟 / 费用</text>
    <path d="M200 620 C280 400 360 310 500 300 S780 290 1080 288" fill="none" stroke="#16A34A" stroke-width="8"/>
    <circle cx="500" cy="300" r="10" fill="#16A34A"/><text x="530" y="280" class="h" fill="#15803D">简单任务：很早饱和</text>
    <path d="M200 665 C410 650 520 560 640 455 S850 285 1080 250" fill="none" stroke="#4F46E5" stroke-width="8"/>
    <circle cx="640" cy="455" r="10" fill="#4F46E5"/><text x="670" y="445" class="h" fill="#4338CA">困难但可解：预算带来收益</text>
    <path d="M200 680 C420 670 700 665 1080 650" fill="none" stroke="#EF4444" stroke-width="8" stroke-dasharray="18 14"/>
    <text x="720" y="635" class="h" fill="#B91C1C">错误前提 / 缺失能力：花更多仍失败</text>
    <line x1="430" y1="230" x2="430" y2="710" stroke="#94A3B8" stroke-width="3" stroke-dasharray="10 10"/><line x1="820" y1="230" x2="820" y2="710" stroke="#94A3B8" stroke-width="3" stroke-dasharray="10 10"/>
    <text x="285" y="735" class="p">低预算</text><text x="575" y="735" class="p">按难度升级</text><text x="920" y="735" class="p">质量优先区</text>
    <g transform="translate(1170 250)"><rect width="350" height="390" rx="28" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="3"/><text x="35" y="58" class="h" fill="#0F172A">可部署的预算路由</text><rect x="35" y="95" width="280" height="60" rx="16" fill="#ECFEFF"/><text x="175" y="132" text-anchor="middle" class="p">简单、低风险 → low</text><rect x="35" y="180" width="280" height="60" rx="16" fill="#EEF2FF"/><text x="175" y="217" text-anchor="middle" class="p">验证失败 → 提升 effort</text><rect x="35" y="265" width="280" height="60" rx="16" fill="#FFF7ED"/><text x="175" y="302" text-anchor="middle" class="p">高价值难题 → 高预算</text><text x="35" y="365" class="p">总预算、超时、停止条件仍必需</text></g>
    <text x="800" y="842" text-anchor="middle" font-size="20" font-weight="700" fill="#334155">正确问题不是“最高 effort 有多强”，而是“在哪些任务上，额外质量值得额外成本”</text>
  </g>
</svg>
