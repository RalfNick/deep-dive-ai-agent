<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">RAG 的离线索引与在线回答</title>
  <desc id="desc">左侧整理知识并建索引，右侧查询、检索、验证并形成带引用回答。</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#071426"/><stop offset="1" stop-color="#111827"/></linearGradient>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#60a5fa"/></marker>
  </defs>
  <rect width="1200" height="675" rx="28" fill="url(#bg)"/>
  <g font-family="Microsoft YaHei, PingFang SC, sans-serif">
    <text x="56" y="65" fill="#f8fafc" font-size="36" font-weight="700">一条 RAG 管道，其实是两条生命周期</text>
    <rect x="55" y="120" width="500" height="455" rx="24" fill="#0f2138" stroke="#2563eb" stroke-width="2"/>
    <text x="85" y="170" fill="#60a5fa" font-size="28" font-weight="700">离线：把知识变成可检索对象</text>
    <rect x="90" y="220" width="180" height="72" rx="16" fill="#172554"/><text x="125" y="265" fill="#e2e8f0" font-size="22">文档目录</text>
    <path d="M270 256 H335" stroke="#60a5fa" stroke-width="3" marker-end="url(#arrow)"/>
    <rect x="345" y="220" width="165" height="72" rx="16" fill="#172554"/><text x="385" y="265" fill="#e2e8f0" font-size="22">清洗切块</text>
    <path d="M425 302 V365" stroke="#60a5fa" stroke-width="3" marker-end="url(#arrow)"/>
    <rect x="345" y="375" width="165" height="72" rx="16" fill="#172554"/><text x="380" y="420" fill="#e2e8f0" font-size="22">索引与元数据</text>
    <text x="90" y="515" fill="#94a3b8" font-size="20">状态、版本、可见性、有效期一起入目录</text>
    <rect x="645" y="120" width="500" height="455" rx="24" fill="#10283a" stroke="#34d399" stroke-width="2"/>
    <text x="675" y="170" fill="#34d399" font-size="28" font-weight="700">在线：把问题变成可核对回答</text>
    <rect x="680" y="220" width="170" height="72" rx="16" fill="#064e3b"/><text x="725" y="265" fill="#e2e8f0" font-size="22">问题与权限</text>
    <path d="M850 256 H920" stroke="#60a5fa" stroke-width="3" marker-end="url(#arrow)"/>
    <rect x="930" y="220" width="170" height="72" rx="16" fill="#064e3b"/><text x="970" y="265" fill="#e2e8f0" font-size="22">过滤与召回</text>
    <path d="M1015 302 V365" stroke="#60a5fa" stroke-width="3" marker-end="url(#arrow)"/>
    <rect x="930" y="375" width="170" height="72" rx="16" fill="#064e3b"/><text x="965" y="420" fill="#e2e8f0" font-size="22">证据与引用</text>
    <path d="M930 411 H860" stroke="#60a5fa" stroke-width="3" marker-end="url(#arrow)"/>
    <rect x="680" y="375" width="170" height="72" rx="16" fill="#064e3b"/><text x="725" y="420" fill="#e2e8f0" font-size="22">回答或拒答</text>
    <text x="56" y="625" fill="#94a3b8" font-size="20">来源：S01、S09、S15｜更新索引与处理一次查询不是同一事务</text>
  </g>
</svg>
