<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">模型、Context、Memory、RAG 与工具的边界</title>
  <desc id="desc">按事实所有者和生命周期区分五个容易混淆的系统表面。</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#071426"/><stop offset="1" stop-color="#111827"/></linearGradient>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#60a5fa"/></marker>
  </defs>
  <rect width="1200" height="675" rx="28" fill="url(#bg)"/>
  <g font-family="Microsoft YaHei, PingFang SC, sans-serif">
    <text x="56" y="65" fill="#f8fafc" font-size="36" font-weight="700">RAG 不是“给模型多塞一点文字”</text>
    <text x="56" y="105" fill="#94a3b8" font-size="22">先问：事实由谁拥有？在什么时候进入 Context？</text>
    <rect x="55" y="160" width="205" height="330" rx="22" fill="#111c33" stroke="#334155" stroke-width="2"/>
    <text x="85" y="210" fill="#60a5fa" font-size="28" font-weight="700">模型参数</text>
    <text x="85" y="255" fill="#e2e8f0" font-size="20">训练时获得</text><text x="85" y="292" fill="#e2e8f0" font-size="20">调用时不写回</text>
    <rect x="280" y="160" width="205" height="330" rx="22" fill="#111c33" stroke="#334155" stroke-width="2"/>
    <text x="310" y="210" fill="#818cf8" font-size="28" font-weight="700">Context</text>
    <text x="310" y="255" fill="#e2e8f0" font-size="20">本次调用输入</text><text x="310" y="292" fill="#e2e8f0" font-size="20">临时装配结果</text>
    <rect x="505" y="145" width="210" height="360" rx="22" fill="#10283a" stroke="#34d399" stroke-width="3"/>
    <text x="535" y="205" fill="#34d399" font-size="30" font-weight="700">RAG</text>
    <text x="535" y="252" fill="#f8fafc" font-size="21">外部知识 → 证据</text><text x="535" y="292" fill="#e2e8f0" font-size="20">可更新、可过滤</text><text x="535" y="332" fill="#e2e8f0" font-size="20">可引用、可拒答</text>
    <rect x="735" y="160" width="190" height="330" rx="22" fill="#111c33" stroke="#334155" stroke-width="2"/>
    <text x="765" y="210" fill="#fbbf24" font-size="28" font-weight="700">Memory</text>
    <text x="765" y="255" fill="#e2e8f0" font-size="20">跨任务复用</text><text x="765" y="292" fill="#e2e8f0" font-size="20">偏好与经验</text>
    <rect x="945" y="160" width="200" height="330" rx="22" fill="#111c33" stroke="#334155" stroke-width="2"/>
    <text x="975" y="210" fill="#f472b6" font-size="28" font-weight="700">Tools</text>
    <text x="975" y="255" fill="#e2e8f0" font-size="20">读取或改变世界</text><text x="975" y="292" fill="#e2e8f0" font-size="20">需要权限边界</text>
    <path d="M160 545 H1040" stroke="#60a5fa" stroke-width="3" marker-end="url(#arrow)"/>
    <text x="56" y="610" fill="#94a3b8" font-size="20">来源：S01、S06、S15｜RAG 是进入 Context 的证据路径，不是模型参数或长期 Memory</text>
  </g>
</svg>
