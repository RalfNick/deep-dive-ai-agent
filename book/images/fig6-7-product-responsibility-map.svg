<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">Claude Code、OpenAI Agent surfaces 与 LangGraph 的责任卡</title>
  <desc id="desc">三张卡按七个维度映射公开责任。OpenAI Agent surfaces 是复合栏，每个条目明确标注 Codex S01、Responses API S02 或 Agents SDK S04；这些产品表面不可互换。Claude Code 依据 S05/S06，LangGraph 与 LangChain 依据 S09/S10。</desc>
  <defs><style>.t{font-family:'Microsoft YaHei','PingFang SC',sans-serif;fill:#172033}.h{font-size:29px;font-weight:700}.s{font-size:15px;fill:#5d6b82}.system{font-size:22px;font-weight:700}.mobile-core{font-size:18px;font-weight:700}.dim{font-size:13px;font-weight:700;fill:#5d6b82}.src{font-size:11px;fill:#5d6b82}.sm{font-size:12px;fill:#5d6b82}.desktop{display:inline}.mobile{display:none}.mobile-title-responsive{font-size:13px;font-weight:700}.mobile-system-responsive{font-size:11px;font-weight:700}.mobile-core-responsive{font-size:10px;font-weight:700}.mobile-source-responsive{font-size:8px;fill:#5d6b82}@media (max-width: 600px){.desktop{display:none}.mobile{display:inline}}</style></defs>
  <rect width="1200" height="675" rx="24" fill="#f8fafc"/>
  <g class="desktop" data-layout="desktop">
  <text x="50" y="56" class="t h">责任卡：同样叫“历史与压缩”，公开制品并不相同</text>
  <text x="50" y="86" class="t s">每个条目都带产品表面与来源 ID · 这是责任映射，不是能力比较</text>

