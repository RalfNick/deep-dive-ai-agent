  <g data-dimension="压缩制品" data-source="S05"><rect x="58" y="286" width="324" height="50" rx="12" fill="#fff"/><text x="72" y="307" class="t dim">压缩制品</text><text x="160" y="313" class="t mobile-core">结构化会话摘要</text><text x="72" y="329" class="t src">Claude Code · S05</text></g>
  <g data-dimension="执行恢复" data-source="S06"><rect x="58" y="341" width="324" height="50" rx="12" fill="#fff"/><text x="72" y="362" class="t dim">执行恢复</text><text x="160" y="368" class="t mobile-core">Resume Session</text><text x="72" y="384" class="t src">Claude Code · S06 · 不等于副作用回滚</text></g>
