<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">从无记忆到受控 Memory Runtime 的七步演进</title>
  <desc id="desc">展示 v0 到 v6 每一步由前一版本失败推动，只增加一个核心能力。</desc>
  <defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#07111f"/><stop offset="1" stop-color="#172033"/></linearGradient></defs>
  <rect width="1200" height="675" rx="28" fill="url(#bg)"/>
  <text x="55" y="70" fill="#f8fafc" font-size="38" font-weight="700">每次只增加一个能力</text>
  <text x="55" y="110" fill="#94a3b8" font-size="22">先让失败可见，再引入解决它的概念</text>
  <path d="M90 330 H1110" stroke="#334155" stroke-width="8" stroke-linecap="round"/>
  <g font-family="Microsoft YaHei, PingFang SC, sans-serif" text-anchor="middle">
    <g transform="translate(105 0)"><circle cx="0" cy="330" r="32" fill="#7f1d1d" stroke="#fb7185" stroke-width="3"/><text y="338" fill="#fff" font-size="20" font-weight="700">v0</text><rect x="-70" y="175" width="140" height="100" rx="16" fill="#1f2937"/><text y="215" fill="#f8fafc" font-size="20">无记忆</text><text y="247" fill="#fb7185" font-size="17">直接忘记</text><text y="410" fill="#94a3b8" font-size="17">失败：新会话</text><text y="437" fill="#94a3b8" font-size="17">从零开始</text></g>
    <g transform="translate(265 0)"><circle cx="0" cy="330" r="32" fill="#78350f" stroke="#fbbf24" stroke-width="3"/><text y="338" fill="#fff" font-size="20" font-weight="700">v1</text><rect x="-70" y="175" width="140" height="100" rx="16" fill="#1f2937"/><text y="215" fill="#f8fafc" font-size="20">完整历史</text><text y="247" fill="#fbbf24" font-size="17">全部回放</text><text y="410" fill="#94a3b8" font-size="17">失败：噪声与</text><text y="437" fill="#94a3b8" font-size="17">权限混杂</text></g>
    <g transform="translate(425 0)"><circle cx="0" cy="330" r="32" fill="#1e3a8a" stroke="#60a5fa" stroke-width="3"/><text y="338" fill="#fff" font-size="20" font-weight="700">v2</text><rect x="-70" y="175" width="140" height="100" rx="16" fill="#1f2937"/><text y="215" fill="#f8fafc" font-size="20">结构化记录</text><text y="247" fill="#60a5fa" font-size="17">类型与来源</text><text y="410" fill="#94a3b8" font-size="17">失败：什么都</text><text y="437" fill="#94a3b8" font-size="17">可能被写入</text></g>
    <g transform="translate(585 0)"><circle cx="0" cy="330" r="32" fill="#064e3b" stroke="#34d399" stroke-width="3"/><text y="338" fill="#fff" font-size="20" font-weight="700">v3</text><rect x="-70" y="175" width="140" height="100" rx="16" fill="#1f2937"/><text y="215" fill="#f8fafc" font-size="20">Write Gate</text><text y="247" fill="#34d399" font-size="17">先审后写</text><text y="410" fill="#94a3b8" font-size="17">失败：存着却</text><text y="437" fill="#94a3b8" font-size="17">召回不准</text></g>
    <g transform="translate(745 0)"><circle cx="0" cy="330" r="32" fill="#4c1d95" stroke="#a78bfa" stroke-width="3"/><text y="338" fill="#fff" font-size="20" font-weight="700">v4</text><rect x="-70" y="175" width="140" height="100" rx="16" fill="#1f2937"/><text y="215" fill="#f8fafc" font-size="20">Recall</text><text y="247" fill="#a78bfa" font-size="17">过滤再排序</text><text y="410" fill="#94a3b8" font-size="17">失败：旧值与</text><text y="437" fill="#94a3b8" font-size="17">新值冲突</text></g>
    <g transform="translate(905 0)"><circle cx="0" cy="330" r="32" fill="#831843" stroke="#f472b6" stroke-width="3"/><text y="338" fill="#fff" font-size="20" font-weight="700">v5</text><rect x="-70" y="175" width="140" height="100" rx="16" fill="#1f2937"/><text y="215" fill="#f8fafc" font-size="20">Correct / Forget</text><text y="247" fill="#f472b6" font-size="17">版本与墓碑</text><text y="410" fill="#94a3b8" font-size="17">失败：串线与</text><text y="437" fill="#94a3b8" font-size="17">不可解释</text></g>
    <g transform="translate(1065 0)"><circle cx="0" cy="330" r="36" fill="#065f46" stroke="#6ee7b7" stroke-width="4"/><text y="338" fill="#fff" font-size="20" font-weight="700">v6</text><rect x="-75" y="165" width="150" height="110" rx="16" fill="#102b2b" stroke="#34d399"/><text y="207" fill="#f8fafc" font-size="20">治理与评估</text><text y="241" fill="#6ee7b7" font-size="17">隔离、Trace</text><text y="410" fill="#a7f3d0" font-size="17">可检查的</text><text y="437" fill="#a7f3d0" font-size="17">Memory Runtime</text></g>
  </g>
  <rect x="170" y="535" width="860" height="80" rx="22" fill="#111c33" stroke="#334155"/>
  <text x="210" y="572" fill="#e2e8f0" font-size="21">阅读方法：先看本版本暴露的失败，再读新增的 20–40 行核心代码。</text>
  <text x="210" y="603" fill="#94a3b8" font-size="18">框架映射放到最后；理解这些边界后，Store 或模型可以替换。</text>
</svg>
