<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675">
 <defs><style>.t{font-family:'Microsoft YaHei',sans-serif;fill:#172033}.h{font-size:34px;font-weight:700}.s{font-size:19px;fill:#5d6b82}.k{font-size:23px;font-weight:700}.b{font-size:18px}.a{stroke:#3157d5;stroke-width:4;fill:none;marker-end:url(#m)}.d{stroke:#df6b20;stroke-width:4;fill:none;stroke-dasharray:8 7;marker-end:url(#o)}</style><marker id="m" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0 0L0 6L9 3z" fill="#3157d5"/></marker><marker id="o" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0 0L0 6L9 3z" fill="#df6b20"/></marker></defs>
 <rect width="1200" height="675" rx="24" fill="#f8fafc"/><text x="70" y="72" class="t h">最小 Agent Loop：四个角色、两种结束</text><text x="70" y="108" class="t s">模型提出动作；Harness 校验并执行；环境返回观察；验收器决定能否接受完成</text>
 <rect x="70" y="205" width="220" height="150" rx="22" fill="#fff" stroke="#d9e2ef" stroke-width="2"/><text x="105" y="258" class="t k">① Model</text><text x="105" y="296" class="t b">基于轨迹选择</text><text x="105" y="327" class="t b">工具调用或最终答案</text>
 <rect x="370" y="205" width="220" height="150" rx="22" fill="#edf3ff" stroke="#9eb2ef" stroke-width="2"/><text x="405" y="258" class="t k">② Harness</text><text x="405" y="296" class="t b">参数、权限、预算</text><text x="405" y="327" class="t b">执行、记录、回传</text>
 <rect x="670" y="205" width="220" height="150" rx="22" fill="#eaf8f8" stroke="#8bcbd2" stroke-width="2"/><text x="705" y="258" class="t k">③ Environment</text><text x="705" y="296" class="t b">文件、进程、网页</text><text x="705" y="327" class="t b">产生事实与副作用</text>
 <rect x="970" y="205" width="160" height="150" rx="22" fill="#fff3e8" stroke="#efb186" stroke-width="2"/><text x="992" y="258" class="t k">④ Verifier</text><text x="992" y="296" class="t b">测试 / 规则</text><text x="992" y="327" class="t b">验收条件</text>
 <path d="M290 280H360" class="a"/><text x="305" y="262" class="t s">call</text><path d="M590 280H660" class="a"/><text x="601" y="262" class="t s">execute</text><path d="M890 280H960" class="a"/><text x="905" y="262" class="t s">check</text>
 <path d="M780 365 V470 H180 V365" class="a"/><text x="395" y="500" class="t k">Observation 写回轨迹，下一轮不再面对同一个世界</text>
 <path d="M1050 365 V565 H250" class="d"/><text x="510" y="552" class="t b" fill="#df6b20">未通过：拒绝“完成”，把证据写回循环</text>
 <rect x="900" y="465" width="230" height="78" rx="18" fill="#172b5b"/><text x="949" y="498" font-family="Microsoft YaHei" font-size="22" font-weight="700" fill="#fff">已验证完成</text><text x="942" y="527" font-family="Microsoft YaHei" font-size="16" fill="#cbd8f2">交付结果与证据</text>
 <path d="M1050 355V455" class="a"/>
</svg>
