<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675">
 <defs><style>.t{font-family:'Microsoft YaHei',sans-serif;fill:#172033}.h{font-size:34px;font-weight:700}.s{font-size:19px;fill:#5d6b82}.k{font-size:22px;font-weight:700}.b{font-size:17px}.mono{font-family:Consolas,'Microsoft YaHei';font-size:16px}.a{stroke:#3157d5;stroke-width:4;fill:none;marker-end:url(#m)}</style><marker id="m" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0 0L0 6L9 3z" fill="#3157d5"/></marker></defs>
 <rect width="1200" height="675" rx="24" fill="#f8fafc"/><text x="70" y="72" class="t h">Tool Call 不是函数已经执行</text><text x="70" y="108" class="t s">一个 call_id 串起“模型提议—运行时执行—环境观察”的因果链</text>
 <rect x="70" y="165" width="310" height="330" rx="22" fill="#fff" stroke="#d9e2ef" stroke-width="2"/><text x="98" y="210" class="t k">模型输出 · Proposal</text><text x="98" y="252" class="t mono">call_id: "call-patch"</text><text x="98" y="286" class="t mono">name: "apply_patch"</text><text x="98" y="320" class="t mono">arguments:</text><text x="118" y="352" class="t mono">path: "pricing.py"</text><text x="118" y="384" class="t mono">old: "..."</text><text x="118" y="416" class="t mono">new: "..."</text><rect x="98" y="447" width="224" height="30" rx="15" fill="#fff2e8"/><text x="114" y="468" class="t b">此时文件尚未改变</text>
 <rect x="445" y="165" width="310" height="330" rx="22" fill="#edf3ff" stroke="#9eb2ef" stroke-width="2"/><text x="473" y="210" class="t k">Harness · Enforcement</text><text x="473" y="254" class="t b">1. 工具名存在吗？</text><text x="473" y="290" class="t b">2. 参数结构与类型正确吗？</text><text x="473" y="326" class="t b">3. 路径与权限允许吗？</text><text x="473" y="362" class="t b">4. 是否需要人工批准？</text><text x="473" y="398" class="t b">5. 超时、并发、幂等如何处理？</text><rect x="473" y="439" width="248" height="38" rx="10" fill="#3157d5"/><text x="512" y="465" font-family="Microsoft YaHei" font-size="18" fill="#fff">只有这里会执行</text>
 <rect x="820" y="165" width="310" height="330" rx="22" fill="#fff" stroke="#d9e2ef" stroke-width="2"/><text x="848" y="210" class="t k">工具结果 · Observation</text><text x="848" y="252" class="t mono">call_id: "call-patch"</text><text x="848" y="286" class="t mono">ok: true</text><text x="848" y="320" class="t mono">state_changed: true</text><text x="848" y="354" class="t mono">content: "updated..."</text><text x="848" y="402" class="t b">失败时还应给出：</text><text x="868" y="436" class="t mono">error_type</text><text x="868" y="466" class="t mono">retryable</text>
 <path d="M380 330H435" class="a"/><path d="M755 330H810" class="a"/>
 <rect x="70" y="545" width="1060" height="70" rx="18" fill="#eaf8f8"/><text x="98" y="588" class="t b"><tspan font-weight="700">审计不变量：</tspan>每个结果必须能回指原调用；副作用必须由运行时记录；错误要成为可处理的数据。</text>
</svg>
