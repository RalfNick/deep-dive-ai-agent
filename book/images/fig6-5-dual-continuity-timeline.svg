<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">先持久化 Artifact，再由 RunCheckpoint 单向引用</title>
  <desc id="desc">提交边界先确保持久化的 Artifact 可验证，再保存含 artifact_id 的 RunCheckpoint。Checkpoint 通过 artifact_id 单向查找 Artifact；执行轨道恢复 next_step，语义轨道由 Artifact 经 Rehydrator 生成 Packet。</desc>
  <defs>
    <style>.t{font-family:'Microsoft YaHei','PingFang SC',sans-serif;fill:#172033}.h{font-size:31px;font-weight:700}.s{font-size:16px;fill:#5d6b82}.k{font-size:18px;font-weight:700}.b{font-size:15px}.sm{font-size:13px;fill:#5d6b82}.desktop{display:inline}.mobile{display:none}.mobile-core-responsive{font-size:11px;font-weight:700}.mobile-source-responsive{font-size:9px;fill:#5d6b82}@media (max-width: 600px){.desktop{display:none}.mobile{display:inline}}</style>
    <marker id="blue" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9 Z" fill="#3b82f6"/></marker>
    <marker id="cyan" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9 Z" fill="#159b9b"/></marker>
    <marker id="orange" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9 Z" fill="#e28a25"/></marker>
  </defs>
  <rect width="1200" height="675" rx="24" fill="#f8fafc"/>
  <g class="desktop" data-layout="desktop">
  <text x="58" y="62" class="t h">两条连续性在提交边界协调，但状态引用只有一个方向</text>
  <text x="58" y="95" class="t s">持久化顺序保证可恢复；Checkpoint 不复制 Artifact 的目标、约束与证据</text>

  <text x="62" y="146" class="t k">提交顺序</text>
  <rect x="205" y="117" width="260" height="91" rx="18" fill="#eaf8f5" stroke="#58ad9e" stroke-width="2"/>
  <text x="335" y="149" text-anchor="middle" class="t k">1 · 先持久化 Artifact</text>
  <text x="335" y="178" text-anchor="middle" class="t b">校验 schema / source / workspace</text>
  <text x="335" y="198" text-anchor="middle" class="t sm">artifact_id = cmp-001</text>
  <path d="M472 162 H545" stroke="#e28a25" stroke-width="4" marker-end="url(#orange)"/>
  <rect x="555" y="117" width="300" height="91" rx="18" fill="#fff4e8" stroke="#e9a06d" stroke-width="2"/>
  <text x="705" y="149" text-anchor="middle" class="t k">2 · 再保存 RunCheckpoint</text>
  <text x="705" y="178" text-anchor="middle" class="t b">next_step = 12</text>
  <text x="705" y="198" text-anchor="middle" class="t sm">artifact_id = cmp-001</text>
  <path d="M670 214 C645 263 478 263 402 214" fill="none" stroke="#e28a25" stroke-width="2.5" stroke-dasharray="7 6" marker-end="url(#orange)"/>
  <rect x="463" y="230" width="208" height="32" rx="16" fill="#fff4e8"/>
  <text x="567" y="252" text-anchor="middle" class="t b">artifact_id 单向引用</text>
  <rect x="885" y="126" width="248" height="72" rx="18" fill="#172b5b"/>
  <text x="1009" y="154" text-anchor="middle" font-family="Microsoft YaHei" font-size="17" font-weight="700" fill="#fff">Commit boundary</text>
  <text x="1009" y="180" text-anchor="middle" font-family="Microsoft YaHei" font-size="13" fill="#dbe6ff">协调提交顺序，不合并状态</text>

  <text x="62" y="333" class="t k" fill="#245faa">执行连续性</text>
  <text x="62" y="358" class="t sm">Checkpoint → next_step</text>
  <rect x="258" y="303" width="242" height="84" rx="17" fill="#fff4e8" stroke="#e9a06d"/>
  <text x="379" y="335" text-anchor="middle" class="t k">RunCheckpoint</text><text x="379" y="363" text-anchor="middle" class="t b">next_step = 12</text>
  <path d="M508 345 H695" stroke="#3b82f6" stroke-width="4" marker-end="url(#blue)"/>
  <rect x="705" y="303" width="252" height="84" rx="17" fill="#e9f2ff" stroke="#6e9fda"/>
  <text x="831" y="335" text-anchor="middle" class="t k">恢复执行</text><text x="831" y="363" text-anchor="middle" class="t b">从 step 12 继续</text>

  <text x="62" y="469" class="t k" fill="#087f8c">语义连续性</text>
  <text x="62" y="494" class="t sm">Artifact → Rehydrator → Packet</text>
  <rect x="258" y="439" width="202" height="84" rx="17" fill="#eaf8f5" stroke="#58ad9e"/>
  <text x="359" y="471" text-anchor="middle" class="t k">Artifact</text><text x="359" y="499" text-anchor="middle" class="t b">目标 · 约束 · 证据</text>
  <path d="M468 481 H566" stroke="#159b9b" stroke-width="4" marker-end="url(#cyan)"/>
  <rect x="576" y="439" width="190" height="84" rx="17" fill="#eaf8f5" stroke="#58ad9e"/>
  <text x="671" y="471" text-anchor="middle" class="t k">Rehydrator</text><text x="671" y="499" text-anchor="middle" class="t b">先验证，再重建</text>
  <path d="M774 481 H872" stroke="#159b9b" stroke-width="4" marker-end="url(#cyan)"/>
  <rect x="882" y="439" width="202" height="84" rx="17" fill="#172b5b"/>
  <text x="983" y="471" text-anchor="middle" font-family="Microsoft YaHei" font-size="18" font-weight="700" fill="#fff">ContextPacket</text><text x="983" y="499" text-anchor="middle" font-family="Microsoft YaHei" font-size="14" fill="#dbe6ff">下一轮模型输入</text>

  <path d="M1009 205 V279 H1090 V535 H1009" fill="none" stroke="#e28a25" stroke-width="2" stroke-dasharray="6 6"/>
  <text x="1065" y="302" text-anchor="middle" class="t sm">提交边界协调两轨</text>
  <rect x="133" y="565" width="934" height="70" rx="22" fill="#172b5b"/>
  <text x="600" y="594" text-anchor="middle" font-family="Microsoft YaHei" font-size="18" font-weight="700" fill="#fff">Checkpoint 不能单独恢复语义</text>
  <text x="600" y="620" text-anchor="middle" font-family="Microsoft YaHei" font-size="14" fill="#dbe6ff">它只保存执行位置与 artifact_id；语义必须从已验证的 Artifact 重建</text>
  </g>
  <g class="mobile" data-layout="mobile" transform="scale(3.077)">
    <text x="8" y="14" class="t mobile-core-responsive">双连续性：提交协同，引用单向</text>
    <text x="8" y="25" class="t mobile-source-responsive">Checkpoint 管执行位置；Artifact 经验证后重建语义</text>

    <text x="8" y="43" class="t mobile-core-responsive">提交顺序</text>
    <rect x="78" y="32" width="112" height="35" rx="5" fill="#eaf8f5" stroke="#58ad9e" stroke-width="0.8"/>
    <text x="134" y="47" text-anchor="middle" class="t mobile-core-responsive">1 先持久化 Artifact</text><text x="134" y="59" text-anchor="middle" class="t mobile-source-responsive">schema / source / workspace</text>
    <text x="195" y="54" class="t mobile-core-responsive">→</text>
    <rect x="208" y="32" width="124" height="35" rx="5" fill="#fff4e8" stroke="#e9a06d" stroke-width="0.8"/>
    <text x="270" y="47" text-anchor="middle" class="t mobile-core-responsive">2 再保存 Checkpoint</text><text x="270" y="59" text-anchor="middle" class="t mobile-source-responsive">next_step + artifact_id</text>
    <path d="M270 70 C250 83 158 83 134 70" fill="none" stroke="#e28a25" stroke-width="1" stroke-dasharray="3 2"/>
    <text x="202" y="88" text-anchor="middle" class="t mobile-source-responsive">artifact_id 单向引用；不复制目标、约束与证据</text>

    <rect x="8" y="99" width="374" height="39" rx="6" fill="#edf4ff" stroke="#6e9fda" stroke-width="0.7"/>
    <text x="15" y="114" class="t mobile-core-responsive">执行连续性</text>
    <text x="104" y="114" class="t mobile-source-responsive">RunCheckpoint</text><text x="184" y="114" class="t mobile-core-responsive">→</text><text x="204" y="114" class="t mobile-core-responsive">恢复 next_step</text>
    <text x="104" y="128" class="t mobile-source-responsive">回答“从哪里继续”，不声明任务语义完整</text>

    <rect x="8" y="145" width="374" height="45" rx="6" fill="#eaf8f5" stroke="#58ad9e" stroke-width="0.7"/>
    <text x="15" y="160" class="t mobile-core-responsive">语义连续性</text>
    <text x="104" y="160" class="t mobile-core-responsive">Artifact</text><text x="166" y="160" class="t mobile-core-responsive">→</text><text x="183" y="160" class="t mobile-core-responsive">Rehydrator</text><text x="262" y="160" class="t mobile-core-responsive">→</text>
    <rect x="278" y="150" width="98" height="20" rx="4" fill="#172b5b"/>
    <text x="327" y="163" text-anchor="middle" font-family="Microsoft YaHei" font-size="11" font-weight="700" fill="#fff">ContextPacket</text>
    <text x="104" y="181" class="t mobile-source-responsive">回答“带着哪些目标、约束、未决问题与证据继续”</text>

    <rect x="25" y="198" width="340" height="16" rx="8" fill="#172b5b"/>
    <text x="195" y="209" text-anchor="middle" font-family="Microsoft YaHei" font-size="9" fill="#fff">Checkpoint 不能单独恢复语义；语义必须从已验证 Artifact 重建</text>
  </g>
</svg>
