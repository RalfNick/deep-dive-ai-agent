<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">从检索候选到证据、引用和拒答</title>
  <desc id="desc">展示检索结果必须经过可信度检查和事实覆盖检查，才能形成可引用回答。</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#071426"/><stop offset="1" stop-color="#111827"/></linearGradient>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#60a5fa"/></marker>
  </defs>
  <rect width="1200" height="675" rx="28" fill="url(#bg)"/>
  <g font-family="Microsoft YaHei, PingFang SC, sans-serif">
    <text x="56" y="65" fill="#f8fafc" font-size="36" font-weight="700">“搜到了”之后，还要证明“这句话由谁支持”</text>
    <rect x="55" y="170" width="210" height="150" rx="22" fill="#111c33" stroke="#60a5fa" stroke-width="2"/>
    <text x="95" y="225" fill="#60a5fa" font-size="27" font-weight="700">检索候选</text><text x="90" y="270" fill="#cbd5e1" font-size="20">内容 + 元数据</text>
    <path d="M265 245 H340" stroke="#60a5fa" stroke-width="3" marker-end="url(#arrow)"/>
    <rect x="350" y="140" width="230" height="210" rx="22" fill="#111c33" stroke="#fbbf24" stroke-width="2"/>
    <text x="390" y="195" fill="#fbbf24" font-size="27" font-weight="700">Evidence Gate</text>
    <text x="385" y="245" fill="#cbd5e1" font-size="20">权限与可信度</text><text x="385" y="282" fill="#cbd5e1" font-size="20">事实覆盖与冲突</text><text x="385" y="319" fill="#cbd5e1" font-size="20">不把文档当指令</text>
    <path d="M580 215 H675" stroke="#60a5fa" stroke-width="3" marker-end="url(#arrow)"/>
    <path d="M580 295 H675" stroke="#60a5fa" stroke-width="3" marker-end="url(#arrow)"/>
    <rect x="685" y="125" width="210" height="130" rx="22" fill="#064e3b" stroke="#34d399" stroke-width="2"/>
    <text x="730" y="180" fill="#34d399" font-size="27" font-weight="700">Answer</text><text x="720" y="220" fill="#d1fae5" font-size="20">声明 ↔ 引用</text>
    <rect x="685" y="290" width="210" height="130" rx="22" fill="#431407" stroke="#fb923c" stroke-width="2"/>
    <text x="725" y="345" fill="#fb923c" font-size="27" font-weight="700">Abstain</text><text x="715" y="385" fill="#fed7aa" font-size="20">列出缺失事实</text>
    <rect x="945" y="125" width="200" height="295" rx="22" fill="#111c33" stroke="#a78bfa" stroke-width="2"/>
    <text x="985" y="180" fill="#a78bfa" font-size="27" font-weight="700">Citation</text>
    <text x="975" y="230" fill="#cbd5e1" font-size="20">document_id</text><text x="975" y="270" fill="#cbd5e1" font-size="20">chunk_id</text><text x="975" y="310" fill="#cbd5e1" font-size="20">版本与摘要</text><text x="975" y="350" fill="#cbd5e1" font-size="20">稳定定位信息</text>
    <text x="56" y="610" fill="#94a3b8" font-size="20">来源：S07、S12—S15｜引用存在不等于引用支持了对应声明</text>
  </g>
</svg>
