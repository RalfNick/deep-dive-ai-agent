<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 960" role="img" aria-labelledby="title desc">
<title id="title">先跑通，再理解，再接模型</title>
<desc id="desc">四个检查点，分别增加一种证据；上一层通过，不代表下一层通过。</desc>
<defs><marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M 0 1 L 10 6 L 0 11 z" fill="#17365d"/></marker></defs>
<style>.label{font-family:"KaiTi","STKaiti","Microsoft YaHei",sans-serif;fill:#17365d}.small{font-family:"Microsoft YaHei",sans-serif;fill:#46617f}</style>
<rect width="1600" height="960" fill="#fbf5e8"/>
<rect x="24" y="24" width="1552" height="912" rx="34" fill="#fffdf7" stroke="#17365d" stroke-width="3"/>
<text class="label" text-anchor="middle" font-size="42" font-weight="700"><tspan x="800.0" y="92.0">先跑通，再理解，再接模型</tspan></text>
<text class="label" text-anchor="middle" font-size="21" font-weight="400"><tspan x="800.0" y="150.0">四个检查点，分别增加一种证据；上一层通过，不代表下一层通过。</tspan></text>
<path d="M 380.0 375.0 L 460.0 375.0" fill="none" stroke="#155b9a" stroke-width="4" stroke-linecap="round" marker-end="url(#arrow)"/>
<path d="M 760.0 375.0 L 840.0 375.0" fill="none" stroke="#155b9a" stroke-width="4" stroke-linecap="round" marker-end="url(#arrow)"/>
<path d="M 1140.0 375.0 L 1220.0 375.0" fill="none" stroke="#c46b18" stroke-width="4" stroke-linecap="round" marker-end="url(#arrow)" stroke-dasharray="10 9"/>
<rect x="80" y="310" width="300" height="130" rx="24" fill="#dceeff" stroke="#155b9a" stroke-width="4"/>
<text class="label" text-anchor="middle" font-size="25" font-weight="600"><tspan x="230.0" y="360.0">① 离线程序</tspan><tspan x="230.0" y="391.2">解释器能运行</tspan></text>
<rect x="460" y="310" width="300" height="130" rx="24" fill="#dff3e4" stroke="#287a4b" stroke-width="4"/>
<text class="label" text-anchor="middle" font-size="25" font-weight="600"><tspan x="610.0" y="360.0">② 章节依赖</tspan><tspan x="610.0" y="391.2">所选环境能导入</tspan></text>
<rect x="840" y="310" width="300" height="130" rx="24" fill="#ece3fa" stroke="#6846a5" stroke-width="4"/>
<text class="label" text-anchor="middle" font-size="25" font-weight="600"><tspan x="990.0" y="360.0">③ 请求草图</tspan><tspan x="990.0" y="391.2">本地合同成立</tspan></text>
<rect x="1220" y="310" width="300" height="130" rx="24" fill="#fff0d8" stroke="#c46b18" stroke-width="4"/>
<text class="label" text-anchor="middle" font-size="25" font-weight="600"><tspan x="1370.0" y="360.0">④ 真实调用</tspan><tspan x="1370.0" y="391.2">账户与网络验收</tspan></text>
<rect x="220" y="610" width="620" height="130" rx="24" fill="#dff3e4" stroke="#287a4b" stroke-width="4"/>
<text class="label" text-anchor="middle" font-size="25" font-weight="600"><tspan x="530.0" y="660.0">本附录的离线证据</tspan><tspan x="530.0" y="691.2">程序、输入、草图和错误夹具</tspan></text>
<rect x="1040" y="610" width="460" height="130" rx="24" fill="#fff0d8" stroke="#c46b18" stroke-width="4"/>
<text class="label" text-anchor="middle" font-size="25" font-weight="600"><tspan x="1270.0" y="660.0">真实模型</tspan><tspan x="1270.0" y="691.2">未运行就记 not_run</tspan></text>
<rect x="150" y="825" width="1300" height="70" rx="20" fill="#fff7c9" stroke="#9d7510" stroke-width="3"/>
<text class="label" text-anchor="middle" font-size="22" font-weight="600"><tspan x="800.0" y="862.0">工具装得多，不等于工作台可用；每一步都有自己的验收对象。</tspan></text>
</svg>
