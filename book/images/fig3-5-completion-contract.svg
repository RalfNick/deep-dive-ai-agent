<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675">
 <defs><style>.t{font-family:'Microsoft YaHei',sans-serif;fill:#172033}.h{font-size:34px;font-weight:700}.s{font-size:19px;fill:#5d6b82}.k{font-size:22px;font-weight:700}.b{font-size:18px}.a{stroke:#3157d5;stroke-width:4;fill:none;marker-end:url(#m)}</style><marker id="m" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0 0L0 6L9 3z" fill="#3157d5"/></marker></defs>
 <rect width="1200" height="675" rx="24" fill="#f8fafc"/><text x="70" y="72" class="t h">“我做完了”是主张，不是证据</text><text x="70" y="108" class="t s">把完成条件从模型的自然语言中移到可执行验收合同</text>
 <rect x="70" y="175" width="455" height="320" rx="24" fill="#fff2e8" stroke="#efb186" stroke-width="2"/><text x="102" y="222" class="t k">模型拥有完成权：脆弱</text><text x="102" y="272" class="t b">① 输出：“已修复。”</text><text x="102" y="314" class="t b">② Runner 看见 final message</text><text x="102" y="356" class="t b">③ 直接结束</text><rect x="102" y="397" width="390" height="68" rx="14" fill="#fff"/><text x="127" y="426" class="t b">实际：file_changed = false</text><text x="127" y="454" class="t b">实际：tests_pass = false</text>
 <rect x="675" y="175" width="455" height="320" rx="24" fill="#eaf8f8" stroke="#8bcbd2" stroke-width="2"/><text x="707" y="222" class="t k">环境拥有验收权：可审计</text><text x="707" y="272" class="t b">① 模型提出 final candidate</text><text x="707" y="314" class="t b">② Verifier 检查状态与证据</text><text x="707" y="356" class="t b">③ 失败则写回 observation</text><rect x="707" y="397" width="390" height="68" rx="14" fill="#fff"/><text x="732" y="426" class="t b">必须：required_tests.exit_code = 0</text><text x="732" y="454" class="t b">必须：forbidden_changes = 0</text>
 <path d="M525 335H665" class="a"/><text x="547" y="313" class="t s">迁移控制权</text>
 <rect x="180" y="550" width="840" height="64" rx="18" fill="#172b5b"/><text x="251" y="590" font-family="Microsoft YaHei" font-size="22" font-weight="700" fill="#fff">Completion = 可检查的状态谓词，而不是一段听起来肯定的话</text>
</svg>
