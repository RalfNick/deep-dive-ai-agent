<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Decoder-only Transformer 的最小数据流</title>
  <desc id="desc">文本经过分词、向量化、多层因果自注意力和前馈网络，最终产生词表概率并采样下一个 Token。</desc>
  <defs>
    <linearGradient id="block" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4F46E5"/>
      <stop offset="1" stop-color="#7C3AED"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="11" flood-color="#0F172A" flood-opacity=".10"/>
    </filter>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0,0 L12,6 L0,12 Z" fill="#64748B"/>
    </marker>
    <style>
      .font{font-family:"Microsoft YaHei","PingFang SC","Noto Sans CJK SC",sans-serif}
      .title{font-size:44px;font-weight:700;fill:#0F172A}
      .sub{font-size:21px;fill:#475569}
      .h{font-size:23px;font-weight:700;fill:#0F172A}
      .p{font-size:17px;fill:#475569}
      .whiteh{font-size:24px;font-weight:700;fill:#FFFFFF}
      .whitep{font-size:17px;fill:#E0E7FF}
    </style>
  </defs>
  <rect width="1600" height="900" rx="32" fill="#F8FAFC"/>
  <g class="font">
    <text x="90" y="90" class="title">一次“下一个 Token”预测，数据经历了什么</text>
    <text x="90" y="130" class="sub">以生成式大模型常见的 decoder-only Transformer 为心智模型</text>

    <g filter="url(#shadow)">
      <rect x="70" y="330" width="180" height="160" rx="24" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="2"/>
      <text x="160" y="386" text-anchor="middle" class="h">输入文本</text>
      <text x="160" y="428" text-anchor="middle" font-size="27" font-weight="700" fill="#4F46E5">“Agent 会”</text>
      <text x="160" y="461" text-anchor="middle" class="p">当前上下文</text>
    </g>

    <path d="M250 410 H305" stroke="#64748B" stroke-width="4" marker-end="url(#arrow)"/>

    <g filter="url(#shadow)">
      <rect x="305" y="330" width="200" height="160" rx="24" fill="#EEF2FF" stroke="#818CF8" stroke-width="2"/>
      <text x="405" y="380" text-anchor="middle" class="h">Tokenizer</text>
      <text x="405" y="420" text-anchor="middle" class="p">文本 → Token ID</text>
      <text x="405" y="454" text-anchor="middle" font-size="20" font-weight="700" fill="#4F46E5">[14407, 6912]</text>
    </g>

    <path d="M505 410 H560" stroke="#64748B" stroke-width="4" marker-end="url(#arrow)"/>

    <g filter="url(#shadow)">
      <rect x="560" y="330" width="220" height="160" rx="24" fill="#ECFEFF" stroke="#06B6D4" stroke-width="2"/>
      <text x="670" y="380" text-anchor="middle" class="h">Embedding</text>
      <text x="670" y="417" text-anchor="middle" class="p">内容向量 + 位置信息</text>
      <text x="670" y="454" text-anchor="middle" font-size="18" fill="#0E7490">离散 ID → 连续表示</text>
    </g>

    <path d="M780 410 H840" stroke="#64748B" stroke-width="4" marker-end="url(#arrow)"/>

    <g filter="url(#shadow)">
      <rect x="840" y="220" width="350" height="380" rx="30" fill="url(#block)"/>
      <text x="1015" y="270" text-anchor="middle" class="whiteh">Transformer Block × N</text>

      <rect x="885" y="310" width="260" height="95" rx="20" fill="#FFFFFF" fill-opacity=".14" stroke="#C4B5FD" stroke-width="2"/>
      <text x="1015" y="348" text-anchor="middle" class="whiteh">Causal Self-Attention</text>
      <text x="1015" y="379" text-anchor="middle" class="whitep">从可见历史位置读取信息</text>

      <text x="1015" y="438" text-anchor="middle" font-size="22" font-weight="700" fill="#DDD6FE">残差连接 + 归一化</text>

      <rect x="885" y="470" width="260" height="85" rx="20" fill="#FFFFFF" fill-opacity=".14" stroke="#C4B5FD" stroke-width="2"/>
      <text x="1015" y="508" text-anchor="middle" class="whiteh">Feed-Forward</text>
      <text x="1015" y="538" text-anchor="middle" class="whitep">逐位置进行非线性变换</text>

    </g>

    <path d="M1190 410 H1245" stroke="#64748B" stroke-width="4" marker-end="url(#arrow)"/>

    <g filter="url(#shadow)">
      <rect x="1245" y="270" width="285" height="280" rx="28" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="2"/>
      <text x="1387" y="318" text-anchor="middle" class="h">词表概率</text>
      <text x="1387" y="350" text-anchor="middle" class="p">Linear → Logits → Softmax</text>

      <text x="1290" y="405" class="p">读取</text>
      <rect x="1350" y="385" width="130" height="22" rx="11" fill="#4F46E5"/>
      <text x="1290" y="445" class="p">调用</text>
      <rect x="1350" y="425" width="95" height="22" rx="11" fill="#818CF8"/>
      <text x="1290" y="485" class="p">忘记</text>
      <rect x="1350" y="465" width="38" height="22" rx="11" fill="#C7D2FE"/>
      <text x="1387" y="530" text-anchor="middle" font-size="21" font-weight="700" fill="#4F46E5">选择 / 采样：“读取”</text>
    </g>

    <path d="M1387 550 V680 H230 V515" stroke="#F97316" stroke-width="4" fill="none" marker-end="url(#arrow)"/>
    <rect x="680" y="650" width="360" height="58" rx="20" fill="#FFF7ED" stroke="#FDBA74" stroke-width="2"/>
    <text x="860" y="686" text-anchor="middle" font-size="21" font-weight="700" fill="#C2410C">追加到上下文，再预测一次</text>

    <rect x="120" y="760" width="1360" height="70" rx="22" fill="#0F172A"/>
    <text x="800" y="804" text-anchor="middle" font-size="23" font-weight="700" fill="#FFFFFF">模型每次只前进一步；连贯文本来自同一计算被自回归地重复执行</text>
  </g>
</svg>
