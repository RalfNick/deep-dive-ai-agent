<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 960" role="img" aria-labelledby="title desc">
<title id="title">Computer Use：行动须经五道门</title>
<desc id="desc">本图是模拟回执，不表示真的控制了桌面。</desc>
<defs><marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M 0 1 L 10 6 L 0 11 z" fill="#17365d"/></marker></defs>
<style>.label{font-family:"KaiTi","STKaiti","Microsoft YaHei",sans-serif;fill:#17365d}.small{font-family:"Microsoft YaHei",sans-serif;fill:#46617f}</style>
<rect width="1600" height="960" fill="#fbf5e8"/>
<rect x="24" y="24" width="1552" height="912" rx="34" fill="#fffdf7" stroke="#17365d" stroke-width="3"/>
<text class="label" text-anchor="middle" font-size="42" font-weight="700"><tspan x="800.0" y="92.0">Computer Use：行动须经五道门</tspan></text>
<text class="label" text-anchor="middle" font-size="21" font-weight="400"><tspan x="800.0" y="150.0">本图是模拟回执，不表示真的控制了桌面。</tspan></text>
<path d="M 310.0 430.0 L 370.0 430.0" fill="none" stroke="#155b9a" stroke-width="4" stroke-linecap="round" marker-end="url(#arrow)"/>
<path d="M 620.0 430.0 L 680.0 430.0" fill="none" stroke="#155b9a" stroke-width="4" stroke-linecap="round" marker-end="url(#arrow)"/>
<path d="M 930.0 430.0 L 990.0 430.0" fill="none" stroke="#155b9a" stroke-width="4" stroke-linecap="round" marker-end="url(#arrow)"/>
<path d="M 1240.0 430.0 L 1290.0 430.0" fill="none" stroke="#155b9a" stroke-width="4" stroke-linecap="round" marker-end="url(#arrow)"/>
<path d="M 185.0 490.0 L 395.0 640.0" fill="none" stroke="#b8443b" stroke-width="4" stroke-linecap="round" marker-end="url(#arrow)" stroke-dasharray="10 9"/>
<rect x="236.0" y="530.0" width="108" height="32" rx="12" fill="#fffdf7" opacity="0.94"/>
<text class="label" text-anchor="middle" font-size="18" font-weight="500"><tspan x="290.0" y="553.0">超过 2 秒</tspan></text>
<rect x="60" y="370" width="250" height="120" rx="24" fill="#dceeff" stroke="#155b9a" stroke-width="4"/>
<text class="label" text-anchor="middle" font-size="25" font-weight="600"><tspan x="185.0" y="415.0">观察帧</tspan><tspan x="185.0" y="446.2">f1 @ 1000ms</tspan></text>
<rect x="370" y="370" width="250" height="120" rx="24" fill="#ece3fa" stroke="#6846a5" stroke-width="4"/>
<text class="label" text-anchor="middle" font-size="25" font-weight="600"><tspan x="495.0" y="415.0">坐标映射</tspan><tspan x="495.0" y="446.2">x/y 分别缩放</tspan></text>
<rect x="680" y="370" width="250" height="120" rx="24" fill="#fff0d8" stroke="#c46b18" stroke-width="4"/>
<text class="label" text-anchor="middle" font-size="25" font-weight="600"><tspan x="805.0" y="415.0">权限 + 审批</tspan><tspan x="805.0" y="446.2">allow / deny</tspan></text>
<rect x="990" y="370" width="250" height="120" rx="24" fill="#dceeff" stroke="#155b9a" stroke-width="4"/>
<text class="label" text-anchor="middle" font-size="25" font-weight="600"><tspan x="1115.0" y="415.0">模拟行动</tspan><tspan x="1115.0" y="446.2">记录执行回执</tspan></text>
<rect x="1290" y="370" width="250" height="120" rx="24" fill="#dff3e4" stroke="#287a4b" stroke-width="4"/>
<text class="label" text-anchor="middle" font-size="25" font-weight="600"><tspan x="1415.0" y="415.0">新帧复核</tspan><tspan x="1415.0" y="446.2">状态真的改变？</tspan></text>
<rect x="220" y="640" width="350" height="120" rx="24" fill="#fde3df" stroke="#b8443b" stroke-width="4"/>
<text class="label" text-anchor="middle" font-size="25" font-weight="600"><tspan x="395.0" y="685.0">过期 → Refresh</tspan><tspan x="395.0" y="716.2">不再沿用旧坐标</tspan></text>
<rect x="150" y="825" width="1300" height="70" rx="20" fill="#fff7c9" stroke="#9d7510" stroke-width="3"/>
<text class="label" text-anchor="middle" font-size="22" font-weight="600"><tspan x="800.0" y="862.0">提议不是执行；执行不是验证；旧画面必须先刷新。</tspan></text>
</svg>
