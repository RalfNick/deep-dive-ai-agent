<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 960" role="img" aria-labelledby="title desc">
<title id="title">采样与隐私：Head 提前判定，载荷先脱敏</title>
<desc id="desc">Head 只看标识；Tail 读取的完整载荷必须已经脱敏。</desc>
<defs><marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M 0 1 L 10 6 L 0 11 z" fill="#17365d"/></marker></defs>
<style>.label{font-family:"KaiTi","STKaiti","Microsoft YaHei",sans-serif;fill:#17365d}.small{font-family:"Microsoft YaHei",sans-serif;fill:#46617f}</style>
<rect width="1600" height="960" fill="#fbf5e8"/>
<rect x="24" y="24" width="1552" height="912" rx="34" fill="#fffdf7" stroke="#17365d" stroke-width="3"/>
<text class="label" text-anchor="middle" font-size="42" font-weight="700"><tspan x="800.0" y="92.0">采样与隐私：Head 提前判定，载荷先脱敏</tspan></text>
<text class="label" text-anchor="middle" font-size="21" font-weight="400"><tspan x="800.0" y="150.0">Head 只看标识；Tail 读取的完整载荷必须已经脱敏。</tspan></text>
<path d="M 290.0 450.0 L 400.0 280.0" fill="none" stroke="#c46b18" stroke-width="4" stroke-linecap="round" marker-end="url(#arrow)"/>
<rect x="255.0" y="330.0" width="180" height="32" rx="12" fill="#fffdf7" opacity="0.94"/>
<text class="label" text-anchor="middle" font-size="18" font-weight="500"><tspan x="345.0" y="353.0">仅 Trace ID</tspan></text>
<path d="M 670.0 280.0 Q 1036.5 297.0 1370.0 450.0" fill="none" stroke="#c46b18" stroke-width="4" stroke-linecap="round" marker-end="url(#arrow)" stroke-dasharray="10 9"/>
<rect x="991.5" y="262.0" width="90" height="32" rx="12" fill="#fffdf7" opacity="0.94"/>
<text class="label" text-anchor="middle" font-size="18" font-weight="500"><tspan x="1036.5" y="285.0">是否保留</tspan></text>
<path d="M 290.0 450.0 L 400.0 580.0" fill="none" stroke="#155b9a" stroke-width="4" stroke-linecap="round" marker-end="url(#arrow)"/>
<rect x="300.0" y="480.0" width="90" height="32" rx="12" fill="#fffdf7" opacity="0.94"/>
<text class="label" text-anchor="middle" font-size="18" font-weight="500"><tspan x="345.0" y="503.0">载荷先脱敏</tspan></text>
<path d="M 670.0 580.0 L 760.0 580.0" fill="none" stroke="#155b9a" stroke-width="4" stroke-linecap="round" marker-end="url(#arrow)"/>
<rect x="643.0" y="545.0" width="144" height="32" rx="12" fill="#fffdf7" opacity="0.94"/>
<text class="label" text-anchor="middle" font-size="18" font-weight="500"><tspan x="715.0" y="568.0">安全 Trace</tspan></text>
<path d="M 1000.0 580.0 L 1080.0 580.0" fill="none" stroke="#155b9a" stroke-width="4" stroke-linecap="round" marker-end="url(#arrow)"/>
<rect x="977.0" y="545.0" width="126" height="32" rx="12" fill="#fffdf7" opacity="0.94"/>
<text class="label" text-anchor="middle" font-size="18" font-weight="500"><tspan x="1040.0" y="568.0">Tail 保留</tspan></text>
<path d="M 1310.0 580.0 L 1370.0 450.0" fill="none" stroke="#155b9a" stroke-width="4" stroke-linecap="round" marker-end="url(#arrow)"/>
<rect x="1295.0" y="480.0" width="90" height="32" rx="12" fill="#fffdf7" opacity="0.94"/>
<text class="label" text-anchor="middle" font-size="18" font-weight="500"><tspan x="1340.0" y="503.0">安全载荷</tspan></text>
<path d="M 180.0 510.0 L 195.0 680.0" fill="none" stroke="#287a4b" stroke-width="4" stroke-linecap="round" marker-end="url(#arrow)" stroke-dasharray="10 9"/>
<rect x="142.5" y="560.0" width="90" height="32" rx="12" fill="#fffdf7" opacity="0.94"/>
<text class="label" text-anchor="middle" font-size="18" font-weight="500"><tspan x="187.5" y="583.0">总体计数</tspan></text>
<rect x="70" y="390" width="220" height="120" rx="24" fill="#dceeff" stroke="#155b9a" stroke-width="4"/>
<text class="label" text-anchor="middle" font-size="25" font-weight="600"><tspan x="180.0" y="435.0">Record</tspan><tspan x="180.0" y="466.2">最小必要字段</tspan></text>
<rect x="400" y="220" width="270" height="120" rx="24" fill="#fff0d8" stroke="#c46b18" stroke-width="4"/>
<text class="label" text-anchor="middle" font-size="25" font-weight="600"><tspan x="535.0" y="265.0">Head Decision</tspan><tspan x="535.0" y="296.2">只读取 Trace ID</tspan></text>
<rect x="400" y="510" width="270" height="140" rx="24" fill="#ece3fa" stroke="#6846a5" stroke-width="4"/>
<text class="label" text-anchor="middle" font-size="25" font-weight="600"><tspan x="535.0" y="565.0">Redact</tspan><tspan x="535.0" y="596.2">凭据删 · 身份哈希</tspan></text>
<rect x="760" y="520" width="240" height="120" rx="24" fill="#fff0d8" stroke="#c46b18" stroke-width="4"/>
<text class="label" text-anchor="middle" font-size="25" font-weight="600"><tspan x="880.0" y="565.0">Tail Decision</tspan><tspan x="880.0" y="596.2">读取安全 Trace</tspan></text>
<rect x="1080" y="520" width="230" height="120" rx="24" fill="#dff3e4" stroke="#287a4b" stroke-width="4"/>
<text class="label" text-anchor="middle" font-size="25" font-weight="600"><tspan x="1195.0" y="565.0">Export</tspan><tspan x="1195.0" y="596.2">安全门禁</tspan></text>
<rect x="1370" y="390" width="180" height="120" rx="24" fill="#dceeff" stroke="#155b9a" stroke-width="4"/>
<text class="label" text-anchor="middle" font-size="25" font-weight="600"><tspan x="1460.0" y="435.0">Store</tspan><tspan x="1460.0" y="466.2">受控 Trace</tspan></text>
<rect x="70" y="680" width="250" height="110" rx="24" fill="#dff3e4" stroke="#287a4b" stroke-width="4"/>
<text class="label" text-anchor="middle" font-size="25" font-weight="600"><tspan x="195.0" y="720.0">Population Metrics</tspan><tspan x="195.0" y="751.2">请求数 · 失败数</tspan></text>
<rect x="150" y="825" width="1300" height="70" rx="20" fill="#fff7c9" stroke="#9d7510" stroke-width="3"/>
<text class="label" text-anchor="middle" font-size="22" font-weight="600"><tspan x="800.0" y="862.0">Head 可提前决定；任何被缓冲、保存或导出的完整载荷都必须先脱敏。</tspan></text>
</svg>
