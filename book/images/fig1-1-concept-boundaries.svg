<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">AI、机器学习、大模型与 Agent 的概念边界</title>
  <desc id="desc">左侧为 AI 包含机器学习、深度学习和大语言模型的层级，右侧说明 Agent 是由大语言模型、上下文、工具、运行时和反馈组成的系统。</desc>
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#0F172A" flood-opacity=".10"/>
    </filter>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0,0 L12,6 L0,12 Z" fill="#64748B"/>
    </marker>
    <style>
      .font{font-family:"Microsoft YaHei","PingFang SC","Noto Sans CJK SC",sans-serif}
      .title{font-size:44px;font-weight:700;fill:#0F172A}
      .sub{font-size:21px;fill:#475569}
      .label{font-size:26px;font-weight:700}
      .small{font-size:18px}
      .boxh{font-size:24px;font-weight:700;fill:#0F172A}
      .boxp{font-size:18px;fill:#475569}
    </style>
  </defs>
  <rect width="1600" height="900" rx="32" fill="#F8FAFC"/>
  <g class="font">
    <text x="90" y="88" class="title">LLM 是模型，Agent 是系统</text>
    <text x="90" y="128" class="sub">左边回答“模型属于什么”，右边回答“模型如何被装进一个会行动的系统”</text>

    <rect x="90" y="190" width="630" height="620" rx="34" fill="#EEF2FF" stroke="#818CF8" stroke-width="3"/>
    <text x="125" y="235" class="label" fill="#3730A3">人工智能 AI</text>
    <text x="125" y="267" class="small" fill="#4F46E5">感知、推理、决策与生成的广泛领域</text>

    <rect x="145" y="305" width="520" height="445" rx="30" fill="#E0E7FF" stroke="#6366F1" stroke-width="3"/>
    <text x="180" y="350" class="label" fill="#4338CA">机器学习 ML</text>
    <text x="180" y="382" class="small" fill="#4F46E5">从数据中学习规律</text>

    <rect x="205" y="420" width="400" height="270" rx="28" fill="#C7D2FE" stroke="#4F46E5" stroke-width="3"/>
    <text x="240" y="466" class="label" fill="#3730A3">深度学习 DL</text>
    <text x="240" y="498" class="small" fill="#4338CA">多层神经网络学习表示</text>

    <rect x="270" y="540" width="270" height="100" rx="24" fill="#4F46E5" filter="url(#shadow)"/>
    <text x="405" y="582" text-anchor="middle" font-size="28" font-weight="700" fill="#FFFFFF">大语言模型 LLM</text>
    <text x="405" y="614" text-anchor="middle" font-size="17" fill="#E0E7FF">根据上下文生成下一个 Token</text>

    <path d="M720 500 H805" stroke="#64748B" stroke-width="4" fill="none" marker-end="url(#arrow)"/>
    <text x="762" y="475" text-anchor="middle" font-size="17" fill="#64748B">被系统调用</text>

    <rect x="805" y="190" width="705" height="620" rx="34" fill="#FFFFFF" stroke="#0F172A" stroke-width="3" filter="url(#shadow)"/>
    <text x="850" y="240" font-size="30" font-weight="700" fill="#0F172A">Agent System</text>
    <text x="850" y="274" class="small" fill="#64748B">围绕目标持续观察、决策、行动与验证</text>

    <rect x="850" y="330" width="250" height="150" rx="24" fill="#EEF2FF" stroke="#6366F1" stroke-width="2"/>
    <text x="975" y="382" text-anchor="middle" class="boxh">LLM</text>
    <text x="975" y="418" text-anchor="middle" class="boxp">理解上下文</text>
    <text x="975" y="446" text-anchor="middle" class="boxp">提出下一步</text>

    <rect x="1170" y="330" width="290" height="150" rx="24" fill="#ECFEFF" stroke="#06B6D4" stroke-width="2"/>
    <text x="1315" y="382" text-anchor="middle" class="boxh">Context</text>
    <text x="1315" y="418" text-anchor="middle" class="boxp">指令 · 历史 · 文件</text>
    <text x="1315" y="446" text-anchor="middle" class="boxp">检索结果 · 工具描述</text>

    <rect x="850" y="540" width="180" height="130" rx="22" fill="#ECFDF5" stroke="#10B981" stroke-width="2"/>
    <text x="940" y="592" text-anchor="middle" class="boxh">Tools</text>
    <text x="940" y="628" text-anchor="middle" class="boxp">搜索 · Shell</text>

    <rect x="1065" y="540" width="180" height="130" rx="22" fill="#FFF7ED" stroke="#F97316" stroke-width="2"/>
    <text x="1155" y="592" text-anchor="middle" class="boxh">Runtime</text>
    <text x="1155" y="628" text-anchor="middle" class="boxp">执行 · 沙箱</text>

    <rect x="1280" y="540" width="180" height="130" rx="22" fill="#FEF2F2" stroke="#EF4444" stroke-width="2"/>
    <text x="1370" y="592" text-anchor="middle" class="boxh">Feedback</text>
    <text x="1370" y="628" text-anchor="middle" class="boxp">测试 · 观察</text>

    <path d="M1150 405 H1115" stroke="#64748B" stroke-width="3" marker-end="url(#arrow)"/>
    <path d="M975 480 V520 H940 V535" stroke="#64748B" stroke-width="3" fill="none" marker-end="url(#arrow)"/>
    <path d="M1030 605 H1055" stroke="#64748B" stroke-width="3" marker-end="url(#arrow)"/>
    <path d="M1245 605 H1270" stroke="#64748B" stroke-width="3" marker-end="url(#arrow)"/>
    <path d="M1370 540 V505 H1005 V490" stroke="#64748B" stroke-width="3" fill="none" marker-end="url(#arrow)"/>

    <rect x="850" y="720" width="610" height="55" rx="18" fill="#0F172A"/>
    <text x="1155" y="755" text-anchor="middle" font-size="21" font-weight="700" fill="#FFFFFF">能力来自模型 + Harness，边界来自权限 + 验证</text>
  </g>
</svg>
