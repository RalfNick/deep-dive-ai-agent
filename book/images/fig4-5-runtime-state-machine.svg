<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720">
  <defs>
    <style>.t{font-family:'Microsoft YaHei',sans-serif;fill:#172033}.h{font-size:34px;font-weight:700}.s{font-size:18px;fill:#5d6b82}.k{font-size:18px;font-weight:700}.b{font-size:13px}</style>
    <marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#64748b"/></marker>
  </defs>
  <rect width="1200" height="720" rx="24" fill="#f8fafc"/>
  <text x="70" y="68" class="t h">运行状态机：等待、过期、验证和失败不是一件事</text>
  <text x="70" y="103" class="t s">图中九个状态均由本章 RunStatus 表达；VERIFYING 是短暂但显式的状态</text>
  <circle cx="82" cy="330" r="15" fill="#3157d5"/><path d="M99 330 H160" stroke="#64748b" stroke-width="3" marker-end="url(#a)"/>
  <rect x="168" y="278" width="180" height="102" rx="20" fill="#e8edff" stroke="#91a8ed" stroke-width="2"/>
  <text x="258" y="320" text-anchor="middle" class="t k">RUNNING</text><text x="258" y="350" text-anchor="middle" class="t b">决策 · 执行 · 观察</text>

  <rect x="450" y="128" width="220" height="86" rx="20" fill="#fff2e8" stroke="#efaa79" stroke-width="2"/>
  <text x="560" y="164" text-anchor="middle" class="t k">WAITING_APPROVAL</text><text x="560" y="191" text-anchor="middle" class="t b">检查点与批准摘要已保存</text>
  <rect x="450" y="286" width="220" height="86" rx="20" fill="#eaf8f8" stroke="#72c3cc" stroke-width="2"/>
  <text x="560" y="322" text-anchor="middle" class="t k">VERIFYING</text><text x="560" y="349" text-anchor="middle" class="t b">完成候选等待独立验收</text>
  <rect x="450" y="444" width="220" height="86" rx="20" fill="#fff" stroke="#d65353" stroke-width="2"/>
  <text x="560" y="480" text-anchor="middle" class="t k" fill="#a93232">FAILED</text><text x="560" y="507" text-anchor="middle" class="t b">永久错误 · 策略拒绝</text>

  <rect x="800" y="72" width="240" height="76" rx="20" fill="#dcf5ee" stroke="#57b99d" stroke-width="2"/>
  <text x="920" y="104" text-anchor="middle" class="t k">COMPLETED</text><text x="920" y="130" text-anchor="middle" class="t b">独立证据接受</text>
  <rect x="800" y="176" width="240" height="76" rx="20" fill="#fff" stroke="#d65353" stroke-width="2"/>
  <text x="920" y="208" text-anchor="middle" class="t k" fill="#a93232">FAILED_VERIFICATION</text><text x="920" y="234" text-anchor="middle" class="t b">候选与环境事实不一致</text>
  <rect x="800" y="280" width="240" height="76" rx="20" fill="#f1f5f9" stroke="#94a3b8" stroke-width="2"/>
  <text x="920" y="312" text-anchor="middle" class="t k">STOPPED</text><text x="920" y="338" text-anchor="middle" class="t b">步数、时间或成本耗尽</text>
  <rect x="800" y="384" width="240" height="76" rx="20" fill="#f1f5f9" stroke="#94a3b8" stroke-width="2"/>
  <text x="920" y="416" text-anchor="middle" class="t k">CANCELLED</text><text x="920" y="442" text-anchor="middle" class="t b">用户拒绝或主动取消</text>
  <rect x="800" y="488" width="240" height="76" rx="20" fill="#fff2e8" stroke="#d97745" stroke-width="2"/>
  <text x="920" y="520" text-anchor="middle" class="t k">APPROVAL_STALE</text><text x="920" y="546" text-anchor="middle" class="t b">状态摘要变化 · 旧批准失效</text>

  <path d="M348 305 C390 245 410 171 442 171" fill="none" stroke="#d97745" stroke-width="3" marker-end="url(#a)"/><text x="385" y="230" class="t b">ask</text>
  <path d="M450 197 C405 224 395 285 355 310" fill="none" stroke="#0a91aa" stroke-width="3" marker-end="url(#a)"/><text x="365" y="270" class="t b">approve + valid digest</text>
  <path d="M348 330 H442" stroke="#0a91aa" stroke-width="3" marker-end="url(#a)"/><text x="378" y="317" class="t b">final</text>
  <path d="M670 312 C720 235 746 120 792 110" fill="none" stroke="#57b99d" stroke-width="3" marker-end="url(#a)"/><text x="712" y="205" class="t b">accepted</text>
  <path d="M670 329 C730 288 746 222 792 214" fill="none" stroke="#d65353" stroke-width="3" marker-end="url(#a)"/><text x="716" y="275" class="t b">rejected</text>
  <path d="M348 354 C400 405 412 470 442 487" fill="none" stroke="#d65353" stroke-width="3" marker-end="url(#a)"/><text x="366" y="425" class="t b">permanent error</text>
  <path d="M348 369 C505 610 680 330 792 318" fill="none" stroke="#94a3b8" stroke-width="3" marker-end="url(#a)"/><text x="510" y="587" class="t b">budget exhausted</text>
  <path d="M670 171 C742 210 735 399 792 422" fill="none" stroke="#94a3b8" stroke-width="3" marker-end="url(#a)"/><text x="725" y="376" class="t b">reject</text>
  <path d="M670 188 C756 245 724 505 792 526" fill="none" stroke="#d97745" stroke-width="3" marker-end="url(#a)"/><text x="688" y="489" class="t b">digest changed, no matching receipt</text>

  <rect x="170" y="646" width="860" height="44" rx="18" fill="#172b5b"/>
  <text x="600" y="674" text-anchor="middle" font-family="Microsoft YaHei" font-size="16" fill="#fff">只有 COMPLETED 表示完成；其他状态分别要求重批、恢复、调查或停止</text>
</svg>
