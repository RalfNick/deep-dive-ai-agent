<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">训练、推理与 Agent 运行时的边界</title>
  <desc id="desc">训练改变权重，推理读取权重和上下文生成输出，Agent 运行时执行工具并将观察结果送回上下文。</desc>
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="11" flood-color="#0F172A" flood-opacity=".10"/>
    </filter>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0,0 L12,6 L0,12 Z" fill="#64748B"/>
    </marker>
    <style>
      .font{font-family:"Microsoft YaHei","PingFang SC","Noto Sans CJK SC",sans-serif}
      .title{font-size:44px;font-weight:700;fill:#0F172A}
      .sub{font-size:21px;fill:#475569}
      .lane{font-size:27px;font-weight:700;fill:#0F172A}
      .h{font-size:22px;font-weight:700;fill:#0F172A}
      .p{font-size:17px;fill:#475569}
      .tag{font-size:17px;font-weight:700}
    </style>
  </defs>
  <rect width="1600" height="900" rx="32" fill="#F8FAFC"/>
  <g class="font">
    <text x="90" y="88" class="title">“模型学会了”可能指三件完全不同的事</text>
    <text x="90" y="128" class="sub">把训练、单次推理和 Agent 外部状态分开，才能设计正确的记忆、更新与安全机制</text>

    <rect x="75" y="180" width="1450" height="180" rx="26" fill="#EEF2FF" stroke="#818CF8" stroke-width="2"/>
    <text x="110" y="225" class="lane">01 训练</text>
    <text x="230" y="225" class="sub">改变模型权重</text>
    <rect x="385" y="215" width="210" height="95" rx="20" fill="#FFFFFF" filter="url(#shadow)"/>
    <text x="490" y="252" text-anchor="middle" class="h">训练数据</text>
    <text x="490" y="283" text-anchor="middle" class="p">文本 · 代码 · 反馈</text>
    <path d="M595 262 H675" stroke="#64748B" stroke-width="4" marker-end="url(#arrow)"/>
    <rect x="675" y="215" width="210" height="95" rx="20" fill="#FFFFFF" filter="url(#shadow)"/>
    <text x="780" y="252" text-anchor="middle" class="h">优化目标</text>
    <text x="780" y="283" text-anchor="middle" class="p">预测误差 · 偏好</text>
    <path d="M885 262 H965" stroke="#64748B" stroke-width="4" marker-end="url(#arrow)"/>
    <rect x="965" y="205" width="260" height="115" rx="22" fill="#4F46E5" filter="url(#shadow)"/>
    <text x="1095" y="250" text-anchor="middle" font-size="25" font-weight="700" fill="#FFFFFF">模型权重</text>
    <text x="1095" y="285" text-anchor="middle" font-size="18" fill="#E0E7FF">更新慢 · 成本高 · 可复用</text>
    <rect x="1280" y="230" width="175" height="64" rx="18" fill="#DDD6FE"/>
    <text x="1367" y="269" text-anchor="middle" class="tag" fill="#5B21B6">离线阶段</text>

    <rect x="75" y="390" width="1450" height="180" rx="26" fill="#ECFEFF" stroke="#06B6D4" stroke-width="2"/>
    <text x="110" y="435" class="lane">02 推理</text>
    <text x="230" y="435" class="sub">上下文 → 输出</text>
    <rect x="385" y="425" width="210" height="95" rx="20" fill="#FFFFFF" filter="url(#shadow)"/>
    <text x="490" y="462" text-anchor="middle" class="h">当前上下文</text>
    <text x="490" y="493" text-anchor="middle" class="p">指令 · 消息 · 工具结果</text>
    <path d="M595 472 H675" stroke="#64748B" stroke-width="4" marker-end="url(#arrow)"/>
    <rect x="675" y="415" width="240" height="115" rx="22" fill="#0891B2" filter="url(#shadow)"/>
    <text x="795" y="460" text-anchor="middle" font-size="25" font-weight="700" fill="#FFFFFF">固定权重的 LLM</text>
    <text x="795" y="495" text-anchor="middle" font-size="18" fill="#CFFAFE">本次调用不改写权重</text>
    <path d="M915 472 H995" stroke="#64748B" stroke-width="4" marker-end="url(#arrow)"/>
    <rect x="995" y="425" width="230" height="95" rx="20" fill="#FFFFFF" filter="url(#shadow)"/>
    <text x="1110" y="462" text-anchor="middle" class="h">输出</text>
    <text x="1110" y="493" text-anchor="middle" class="p">文本或工具调用提议</text>
    <rect x="1280" y="440" width="175" height="64" rx="18" fill="#CFFAFE"/>
    <text x="1367" y="479" text-anchor="middle" class="tag" fill="#0E7490">一次前向计算</text>

    <rect x="75" y="600" width="1450" height="220" rx="26" fill="#ECFDF5" stroke="#10B981" stroke-width="2"/>
    <text x="110" y="645" class="lane">03 Agent 运行时</text>
    <text x="650" y="645" class="sub">改变外部状态，结果写回下一轮上下文</text>
    <rect x="360" y="675" width="200" height="95" rx="20" fill="#FFFFFF" filter="url(#shadow)"/>
    <text x="460" y="712" text-anchor="middle" class="h">编排器</text>
    <text x="460" y="743" text-anchor="middle" class="p">解析提议 · 检查权限</text>
    <path d="M560 722 H630" stroke="#64748B" stroke-width="4" marker-end="url(#arrow)"/>
    <rect x="630" y="675" width="200" height="95" rx="20" fill="#FFFFFF" filter="url(#shadow)"/>
    <text x="730" y="712" text-anchor="middle" class="h">工具与环境</text>
    <text x="730" y="743" text-anchor="middle" class="p">文件 · Shell · API</text>
    <path d="M830 722 H900" stroke="#64748B" stroke-width="4" marker-end="url(#arrow)"/>
    <rect x="900" y="675" width="200" height="95" rx="20" fill="#FFFFFF" filter="url(#shadow)"/>
    <text x="1000" y="712" text-anchor="middle" class="h">外部状态</text>
    <text x="1000" y="743" text-anchor="middle" class="p">文件变化 · 数据 · 日志</text>
    <path d="M1100 722 H1170" stroke="#64748B" stroke-width="4" marker-end="url(#arrow)"/>
    <rect x="1170" y="675" width="230" height="95" rx="20" fill="#065F46" filter="url(#shadow)"/>
    <text x="1285" y="712" text-anchor="middle" font-size="23" font-weight="700" fill="#FFFFFF">观察结果</text>
    <text x="1285" y="743" text-anchor="middle" font-size="17" fill="#D1FAE5">回到下一轮上下文</text>
    <path d="M1285 675 V650 H460 V665" stroke="#10B981" stroke-width="4" fill="none" marker-end="url(#arrow)"/>

    <rect x="110" y="852" width="1380" height="30" rx="15" fill="#0F172A"/>
    <text x="800" y="874" text-anchor="middle" font-size="17" font-weight="700" fill="#FFFFFF">上下文会消失，外部状态可持久化，模型权重只有训练流程才能更新</text>
  </g>
</svg>
