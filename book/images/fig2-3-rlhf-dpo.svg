<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">RLHF 与 DPO 的训练路径比较</title>
  <desc id="desc">两条路径都从偏好对出发。经典 RLHF 训练奖励模型并用强化学习优化策略；DPO 直接用分类式目标提高 chosen 相对 rejected 的概率间隔。</desc>
  <defs><filter id="s"><feDropShadow dx="0" dy="7" stdDeviation="10" flood-color="#0F172A" flood-opacity=".1"/></filter><marker id="a" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0L12 6L0 12Z" fill="#64748B"/></marker><style>.f{font-family:"Microsoft YaHei","PingFang SC",sans-serif}.t{font-size:44px;font-weight:700;fill:#0F172A}.st{font-size:21px;fill:#475569}.h{font-size:26px;font-weight:700;fill:#0F172A}.p{font-size:18px;fill:#475569}.tag{font-size:18px;font-weight:700}</style></defs>
  <rect width="1600" height="900" rx="32" fill="#F8FAFC"/>
  <g class="f">
    <text x="80" y="88" class="t">偏好优化回答的是“二选一更喜欢谁”，不是“事实是什么”</text>
    <text x="80" y="130" class="st">RLHF 与 DPO 共享偏好数据，却用不同路径把相对比较转成策略更新</text>
    <g filter="url(#s)"><rect x="80" y="235" width="350" height="410" rx="28" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="3"/><text x="125" y="295" class="h">共同输入：偏好对</text><rect x="120" y="340" width="270" height="90" rx="18" fill="#DCFCE7"/><text x="150" y="378" class="tag" fill="#15803D">chosen</text><text x="150" y="407" class="p">先运行测试，再最小修改</text><rect x="120" y="455" width="270" height="90" rx="18" fill="#FEE2E2"/><text x="150" y="493" class="tag" fill="#B91C1C">rejected</text><text x="150" y="522" class="p">直接重写，不做验证</text><text x="125" y="592" class="p">同一个 prompt</text><text x="125" y="622" class="p">顺序需随机化并检查偏差</text></g>
    <path d="M430 350H510" stroke="#64748B" stroke-width="4" marker-end="url(#a)"/><path d="M430 530H510" stroke="#64748B" stroke-width="4" marker-end="url(#a)"/>
    <g filter="url(#s)"><rect x="510" y="185" width="470" height="260" rx="28" fill="#EEF2FF" stroke="#6366F1" stroke-width="3"/><text x="555" y="240" class="h">经典 RLHF 路径</text><rect x="555" y="285" width="155" height="90" rx="18" fill="white"/><text x="633" y="322" text-anchor="middle" class="tag" fill="#4338CA">奖励模型</text><text x="633" y="352" text-anchor="middle" class="p">拟合偏好</text><path d="M710 330H770" stroke="#64748B" stroke-width="4" marker-end="url(#a)"/><rect x="770" y="285" width="165" height="90" rx="18" fill="white"/><text x="852" y="322" text-anchor="middle" class="tag" fill="#4338CA">RL / PPO</text><text x="852" y="352" text-anchor="middle" class="p">优化策略</text><text x="555" y="410" class="p">显式奖励、在线采样、稳定性与 KL 约束</text></g>
    <g filter="url(#s)"><rect x="510" y="475" width="470" height="260" rx="28" fill="#FFF7ED" stroke="#F97316" stroke-width="3"/><text x="555" y="530" class="h">DPO 路径</text><rect x="555" y="575" width="380" height="90" rx="18" fill="white"/><text x="745" y="612" text-anchor="middle" class="tag" fill="#C2410C">分类式偏好目标</text><text x="745" y="642" text-anchor="middle" class="p">增大 chosen / rejected 的相对概率间隔</text><text x="555" y="700" class="p">无需单独奖励模型与训练中在线采样</text></g>
    <path d="M980 315H1050" stroke="#64748B" stroke-width="4" marker-end="url(#a)"/><path d="M980 605H1050" stroke="#64748B" stroke-width="4" marker-end="url(#a)"/>
    <g filter="url(#s)"><rect x="1050" y="255" width="470" height="420" rx="28" fill="#F0FDF4" stroke="#22C55E" stroke-width="3"/><text x="1095" y="315" class="h">都需要的工程护栏</text><text x="1095" y="380" class="p">• 独立保留集与真实任务评估</text><text x="1095" y="425" class="p">• 长度、语气、位置与标注者偏差检查</text><text x="1095" y="470" class="p">• 相对参考策略的漂移约束</text><text x="1095" y="515" class="p">• 奖励投机与分布外失败测试</text><text x="1095" y="560" class="p">• 安全、事实性与任务成功分开度量</text><rect x="1090" y="600" width="385" height="45" rx="14" fill="#16A34A"/><text x="1283" y="630" text-anchor="middle" class="tag" fill="white">偏好更高 ≠ 真相、安全或任务成功</text></g>
    <text x="800" y="825" text-anchor="middle" font-size="20" font-weight="700" fill="#334155">算法简化不会消除数据定义、评估和分布偏移问题</text>
  </g>
</svg>
