<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675">
 <defs><style>.t{font-family:'Microsoft YaHei',sans-serif;fill:#172033}.h{font-size:34px;font-weight:700}.s{font-size:18px;fill:#5d6b82}.k{font-size:22px;font-weight:700}.b{font-size:16px}.a{stroke:#3157d5;stroke-width:3;fill:none;marker-end:url(#m)}</style><marker id="m" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0 0L0 6L9 3z" fill="#3157d5"/></marker></defs>
 <rect width="1200" height="675" rx="24" fill="#f8fafc"/><text x="70" y="72" class="t h">三种常见编排：不是版本升级，而是不同取舍</text><text x="70" y="108" class="t s">都可以使用工具；差别在计划何时产生、转移由谁控制、失败怎样恢复</text>
 <rect x="70" y="165" width="320" height="405" rx="22" fill="#fff" stroke="#d9e2ef" stroke-width="2"/><text x="98" y="210" class="t k">ReAct / Tool Loop</text><circle cx="135" cy="278" r="34" fill="#e8edff"/><text x="114" y="284" class="t b">想/选</text><circle cx="235" cy="278" r="34" fill="#eaf8f8"/><text x="218" y="284" class="t b">行动</text><circle cx="335" cy="278" r="34" fill="#fff2e8"/><text x="318" y="284" class="t b">观察</text><path d="M169 278H195" class="a"/><path d="M269 278H295" class="a"/><path d="M335 312V345H135V322" class="a"/><text x="98" y="405" class="t b">优点：紧贴环境反馈，易于调整</text><text x="98" y="438" class="t b">风险：局部贪心、循环、轨迹膨胀</text><text x="98" y="488" class="t s">适合：路径事先未知的任务</text>
 <rect x="440" y="165" width="320" height="405" rx="22" fill="#fff" stroke="#d9e2ef" stroke-width="2"/><text x="468" y="210" class="t k">Plan-and-Execute</text><rect x="478" y="250" width="244" height="56" rx="14" fill="#e8edff"/><text x="535" y="285" class="t b">先生成高层计划</text><rect x="478" y="340" width="70" height="54" rx="14" fill="#eaf8f8"/><rect x="565" y="340" width="70" height="54" rx="14" fill="#eaf8f8"/><rect x="652" y="340" width="70" height="54" rx="14" fill="#eaf8f8"/><text x="497" y="373" class="t b">S1</text><text x="584" y="373" class="t b">S2</text><text x="671" y="373" class="t b">S3</text><path d="M600 306V330" class="a"/><text x="468" y="438" class="t b">优点：长任务方向更清晰、可汇报</text><text x="468" y="471" class="t b">风险：早期假设错，计划很快过期</text><text x="468" y="521" class="t s">适合：可分解且需里程碑的任务</text>
 <rect x="810" y="165" width="320" height="405" rx="22" fill="#fff" stroke="#d9e2ef" stroke-width="2"/><text x="838" y="210" class="t k">Graph / State Machine</text><circle cx="875" cy="285" r="34" fill="#e8edff"/><circle cx="970" cy="285" r="34" fill="#eaf8f8"/><circle cx="1065" cy="285" r="34" fill="#fff2e8"/><text x="858" y="291" class="t b">生成</text><text x="953" y="291" class="t b">审核</text><text x="1048" y="291" class="t b">执行</text><path d="M909 285H926" class="a"/><path d="M1004 285H1021" class="a"/><path d="M970 319V358H875V329" class="a"/><text x="838" y="405" class="t b">优点：状态、恢复、审批显式</text><text x="838" y="438" class="t b">风险：图过度设计，维护成本高</text><text x="838" y="488" class="t s">适合：生产流程与合规边界</text>
 <text x="70" y="625" class="t b"><tspan font-weight="700">实践：</tspan>一个系统常混合三者——先计划，局部用 ReAct，关键节点交给状态机和验收器。</text>
</svg>
