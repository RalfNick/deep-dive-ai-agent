name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
    steps:
      - name: Check out full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: |
            requirements-docs.txt
            chapter1/requirements.txt
            chapter2/requirements.txt
            chapter9/requirements.txt
            chapter12/requirements-dev.txt
            chapter12/requirements-preview.txt
            chapter13/requirements-dev.txt
            chapter13/requirements-preview.txt
            chapter14/requirements-dev.txt
            chapter14/requirements-preview.txt
            chapter15/requirements-dev.txt
            chapter15/requirements-preview.txt
            chapter16/requirements-dev.txt
            chapter16/requirements-preview.txt
            chapter17/requirements-dev.txt
            chapter17/requirements-preview.txt
            chapter18/requirements-dev.txt
            chapter18/requirements-preview.txt

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: book/package-lock.json

      - name: Install Python dependencies
        run: >-
          python -m pip install
          -r requirements-docs.txt
          -r chapter1/requirements.txt
          -r chapter2/requirements.txt
          -r chapter9/requirements.txt

      - name: Install book renderer dependencies
        run: npm ci --prefix book

      - name: Check publication safety and reachable Git history
        run: python scripts/check_repository.py --root . --git-history

      - name: Run repository contract tests
        run: python -m unittest discover -s tests -v

      - name: Run Chapter 1 and Chapter 2 gates
        run: |
          python -m unittest discover -s chapter1/tests -v
          python chapter2/sft_mask_demo.py
          python chapter2/real_sft_evidence.py --no-artifacts
          python chapter2/preference_demo.py
          python chapter2/sampling_demo.py
          python chapter2/reasoning_budget_demo.py
          python chapter2/structured_output_demo.py
          python chapter2/model_selection_demo.py

      - name: Run Chapter 3 through Chapter 10 tests
        run: |
          python -m unittest discover -s chapter3/tests -v
          python -m unittest discover -s chapter4/tests -v
          python -m unittest discover -s chapter5/tests -v
          python -m unittest discover -s chapter6/tests -v
          python -m unittest discover -s chapter7/tests -v
          python -m unittest discover -s chapter8/tests -v
          python -m unittest discover -s chapter9/tests -v
          python -m unittest discover -s chapter10/tests -v

      - name: Run Chapter 11 tests
        run: python -B -m unittest discover -s chapter11/tests -v

      - name: Run Chapter 12 tests in its locked environment
        run: |
          python -m venv .venv-chapter12
          .venv-chapter12/bin/python -m pip install --require-hashes -r chapter12/requirements-dev.txt
          .venv-chapter12/bin/python -m pip install -r chapter12/requirements-preview.txt
          .venv-chapter12/bin/python -B -m pytest chapter12/tests -q

      - name: Run Chapter 13 and Chapter 14 tests in their locked environment
        run: |
          python -m venv .venv-evaluation
          .venv-evaluation/bin/python -m pip install --require-hashes -r chapter13/requirements-dev.txt -r chapter14/requirements-dev.txt
          .venv-evaluation/bin/python -m pip install -r chapter13/requirements-preview.txt -r chapter14/requirements-preview.txt
          .venv-evaluation/bin/python -B -m pytest chapter13/tests -q
          .venv-evaluation/bin/python -B -m pytest chapter14/tests -q

      - name: Run Chapter 15 tests in its locked environment
        run: |
          python -m venv .venv-chapter15
          .venv-chapter15/bin/python -m pip install --require-hashes -r chapter15/requirements-dev.txt
          .venv-chapter15/bin/python -m pip install -r chapter15/requirements-preview.txt
          .venv-chapter15/bin/python -B -m pytest chapter15/tests -q

      - name: Run Chapter 16 tests in its locked environment
        run: |
          python -m venv .venv-chapter16
          .venv-chapter16/bin/python -m pip install --require-hashes -r chapter16/requirements-dev.txt
          .venv-chapter16/bin/python -m pip install -r chapter16/requirements-preview.txt
          .venv-chapter16/bin/python -B -m pytest chapter16/tests -q

      - name: Run Chapter 17, Chapter 18 and Appendix A tests in a locked environment
        run: |
          python -m venv .venv-final-chapters
          .venv-final-chapters/bin/python -m pip install --require-hashes -r chapter17/requirements-dev.txt -r chapter18/requirements-dev.txt
          .venv-final-chapters/bin/python -m pip install -r chapter17/requirements-preview.txt -r chapter18/requirements-preview.txt
          .venv-final-chapters/bin/python -B -m pytest chapter17/tests -q
          .venv-final-chapters/bin/python -B -m pytest chapter18/tests -q
          .venv-final-chapters/bin/python -B -m unittest discover -s appendix_a/tests -v

      - name: Regenerate deterministic teaching reports
        run: |
          python chapter1/generate_report.py
          python chapter3/run_all_experiments.py
          python -m chapter4.experiments.boundary_matrix_demo
          python -m chapter5.experiments.run_all --output chapter5/reports/context-experiments.json
          python -m chapter6.experiments.run_all --output chapter6/reports
          python -m chapter7.experiments.run_all --output chapter7/reports
          python -m chapter8.experiments.run_all --output chapter8/reports
          python -m chapter9.experiments.run_all --output chapter9/reports
          python -m chapter10.experiments --write

      - name: Run book renderer contracts
        run: npm test --prefix book

      - name: Build Chinese reading site strictly
        run: |
          python scripts/build_site.py --root . --output _web
          python -m mkdocs build --strict
